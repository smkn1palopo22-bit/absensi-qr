<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Absensi QR Murid - SMK Negeri 1 Palopo</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }

    .container {
      width: 100%;
      max-width: 650px;
      margin: auto;
      padding: 15px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,.08);
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: 24px;
      color: #0f172a;
    }

    .subtitle {
      text-align: center;
      margin-top: 6px;
      color: #64748b;
      font-size: 15px;
    }

    .info {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 20px;
    }

    .info-box {
      background: #f8fafc;
      border-radius: 10px;
      padding: 12px;
      text-align: center;
    }

    .label {
      display: block;
      font-size: 12px;
      color: #64748b;
      margin-bottom: 4px;
    }

    .value {
      display: block;
      font-weight: bold;
      font-size: 16px;
      color: #0f172a;
    }

    .guru-title {
      font-weight: bold;
      margin-bottom: 8px;
      display: block;
    }

    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 16px;
      background: white;
    }

    .guru-status {
      margin-top: 10px;
      font-size: 13px;
      color: #64748b;
      text-align: center;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: auto;
      overflow: hidden;
      border-radius: 12px;
    }

    /* =====================================================
       INDIKATOR SCAN CEPAT
    ===================================================== */

    .indikator-scan {
      margin-top: 12px;
      padding: 18px 10px;
      border-radius: 14px;
      text-align: center;
      font-size: 28px;
      font-weight: 900;
      transition: all 0.15s ease;
      border: 3px solid transparent;
    }

    .indikator-scan.siap {
      background: #dbeafe;
      color: #1d4ed8;
      border-color: #60a5fa;
    }

    .indikator-scan.berhasil {
      background: #16a34a;
      color: white;
      border-color: #15803d;
      transform: scale(1.02);
    }

    .indikator-scan.warning {
      background: #fef3c7;
      color: #92400e;
      border-color: #f59e0b;
    }

    .indikator-scan.error {
      background: #fee2e2;
      color: #991b1b;
      border-color: #ef4444;
    }

    .status-antrean {
      margin-top: 8px;
      padding: 8px;
      text-align: center;
      font-size: 14px;
      font-weight: 700;
      color: #475569;
      min-height: 34px;
    }

    .scanner-status {
      text-align: center;
      margin-top: 10px;
      font-size: 14px;
      color: #64748b;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 14px;
      margin-top: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-start {
      background: #16a34a;
      color: white;
    }

    .btn-stop {
      background: #dc2626;
      color: white;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .result {
      display: none;
      padding: 16px;
      border-radius: 12px;
      margin-top: 15px;
      line-height: 1.6;
    }

    .result.success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .result.warning {
      display: block;
      background: #fef3c7;
      color: #92400e;
    }

    .result.error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .result-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .counter {
      text-align: center;
      color: #64748b;
      font-size: 14px;
    }

    .counter strong {
      display: inline-block;
      font-size: 20px;
      color: #166534;
      margin-left: 4px;
    }

    .loading {
      text-align: center;
      color: #64748b;
      padding: 8px;
    }

    .ready-message {
      margin-top: 10px;
      font-size: 13px;
      opacity: .8;
    }

    /* =====================================================
       NOTIFIKASI
    ===================================================== */

    #notifikasi {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      width: calc(100% - 30px);
      max-width: 480px;
      padding: 15px;
      border-radius: 12px;
      text-align: center;
      font-size: 17px;
      font-weight: bold;
      opacity: 0;
      pointer-events: none;
      transition: .2s ease;
      z-index: 9999;
      box-shadow: 0 5px 20px rgba(0,0,0,.2);
    }

    #notifikasi.tampil {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    #notifikasi.berhasil {
      background: #16a34a;
      color: white;
    }

    #notifikasi.warning {
      background: #f59e0b;
      color: white;
    }

    #notifikasi.error {
      background: #dc2626;
      color: white;
    }

    /* =====================================================
       PENCARIAN NISN
    ===================================================== */

    .nisn-title {
      font-weight: bold;
      font-size: 17px;
      margin-bottom: 10px;
    }

    .nisn-row {
      display: flex;
      gap: 8px;
    }

    #inputNISN {
      flex: 1;
      min-width: 0;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    #inputNISN:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37,99,235,.12);
    }

    .btn-cari-nisn {
      width: auto;
      margin-top: 0;
      padding: 13px 16px;
      background: #2563eb;
      color: white;
      white-space: nowrap;
    }

    #hasilPencarianNISN {
      display: none;
      margin-top: 12px;
      padding: 14px;
      border-radius: 10px;
      line-height: 1.7;
    }

    @media (max-width: 480px) {

      .container {
        padding: 10px;
      }

      .card {
        padding: 15px;
      }

      h1 {
        font-size: 21px;
      }

      .info {
        gap: 7px;
      }

      .nisn-row {
        flex-direction: column;
      }

      .btn-cari-nisn {
        width: 100%;
        margin-top: 8px;
      }

      .indikator-scan {
        font-size: 25px;
        padding: 16px 8px;
      }
    }
  </style>
</head>

<body>

  <!-- =====================================================
       NOTIFIKASI
  ====================================================== -->

  <div id="notifikasi"></div>


  <div class="container">


    <!-- ===================================================
         HEADER / STATUS
    ==================================================== -->

    <div class="card">

      <h1>📷 Absensi QR Murid</h1>

      <div class="subtitle">
        SMK Negeri 1 Palopo
      </div>

      <div class="info">

        <div class="info-box">
          <span class="label">Tanggal</span>
          <span class="value" id="tanggal">-</span>
        </div>

        <div class="info-box">
          <span class="label">Hari</span>
          <span class="value" id="hari">-</span>
        </div>

        <div class="info-box">
          <span class="label">Jam</span>
          <span class="value" id="jam">-</span>
        </div>

        <div class="info-box">
          <span class="label">Kelompok Minggu</span>
          <span class="value" id="kelompok">-</span>
        </div>

      </div>

    </div>


    <!-- ===================================================
         GURU PIKET
    ==================================================== -->

    <div class="card">

      <span class="guru-title">
        👨‍🏫 Guru Piket
      </span>

      <select id="guruPiket">

        <option value="">
          Memuat guru piket...
        </option>

      </select>

      <div
        id="guruStatus"
        class="guru-status">
        Memuat data guru piket...
      </div>

    </div>


    <!-- ===================================================
         SCANNER
    ==================================================== -->

    <div class="card">

      <div id="reader"></div>


      <!-- INDIKATOR CEPAT -->

      <div
        id="indikatorScan"
        class="indikator-scan siap">

        <span id="indikatorIcon">📷</span>

        <span id="indikatorText">
          SIAP SCAN
        </span>

      </div>


      <!-- STATUS ANTREAN -->

      <div
        id="statusAntrean"
        class="status-antrean">

        ☁️ Semua data tersimpan

      </div>


      <div
        id="scannerStatus"
        class="scanner-status">

        Kamera belum dimulai.

      </div>


      <button
        id="btnStart"
        class="btn-start"
        onclick="mulaiScanner()">

        📷 Mulai Kamera

      </button>


      <button
        id="btnStop"
        class="btn-stop"
        onclick="hentikanScanner()"
        style="display:none;">

        ⏹ Hentikan Kamera

      </button>

    </div>


    <!-- ===================================================
         HASIL SCAN
    ==================================================== -->

    <div
      id="hasil"
      class="result">

      <div
        id="hasilJudul"
        class="result-title">
      </div>

      <div id="hasilIsi"></div>

    </div>


    <!-- ===================================================
         COUNTER
    ==================================================== -->

    <div class="card">

      <div class="counter">

        Scan berhasil:

        <strong id="jumlahBerhasil">
          0
        </strong>

      </div>

    </div>


    <!-- ===================================================
         PENCARIAN SISWA BERDASARKAN NISN
    ==================================================== -->

    <div class="card">

      <div class="nisn-title">
        🔎 Cari Siswa Berdasarkan NISN
      </div>

      <div class="nisn-row">

        <input
          type="text"
          id="inputNISN"
          inputmode="numeric"
          maxlength="20"
          placeholder="Masukkan NISN siswa"
          autocomplete="off"
        >

        <button
          type="button"
          class="btn-cari-nisn"
          onclick="cariSiswaNISN()">

          ✅ Absen dengan NISN

        </button>

      </div>

      <div
        id="hasilPencarianNISN">
      </div>

    </div>

  </div>


<script>

/************************************************************
 * ==========================================================
 * KONFIGURASI
 * ==========================================================
 */

const API_URL =
  "https://script.google.com/macros/s/AKfycbzV1PeyqDcgfj7SysWZUN_MKGFFWkmtoi9rB_Bw8PsRXrKHnJRZRYzjMpMcTXHDEljb/exec";


/************************************************************
 * ==========================================================
 * VARIABEL SCANNER
 * ==========================================================
 */

let scanner = null;

let scannerAktif = false;

let jumlahBerhasil = 0;

let qrTerakhir = "";

let waktuScanTerakhir = 0;


/*
 * Jeda untuk mencegah kamera membaca QR yang sama
 * berulang-ulang ketika QR masih berada di depan kamera.
 */

const JEDA_QR_SAMA = 2500;


/************************************************************
 * ==========================================================
 * SISTEM ANTREAN
 * ==========================================================
 */


/*
 * Kunci penyimpanan antrean di browser.
 */

const STORAGE_KEY =
  "antrian_absensi_qr_v1";


/*
 * Semua QR yang belum mendapatkan hasil final
 * dari server berada di sini.
 */

let antreanAbsensi = [];


/*
 * Mencegah dua proses pengiriman berjalan
 * secara bersamaan.
 */

let pengirimanBerjalan = false;


/*
 * Menyimpan QR yang sedang berada dalam antrean.
 */

let qrDalamAntrean =
  new Set();


/*
 * Timer notifikasi lama tetap dipertahankan.
 */

let timerNotifikasi = null;


/*
 * Counter NISN lama.
 * Ditambahkan supaya fungsi NISN warning
 * tidak menghasilkan ReferenceError.
 */

let jumlahSudah = 0;


/************************************************************
 * ==========================================================
 * SAAT HALAMAN DIBUKA
 * ==========================================================
 */

window.addEventListener(
  "load",
  function() {

    muatStatus();

    muatGuruPiket();


    /*
     * Muat antrean yang mungkin masih tersisa
     * dari penggunaan sebelumnya.
     */

    const penyimpananSiap =
      muatAntreanLokal();


    perbaruiStatusAntrean();


    /*
     * Jika penyimpanan tersedia,
     * coba kirim antrean yang tersisa.
     */

    if (penyimpananSiap) {

      prosesAntreanAbsensi();

    }


    /*
     * Pastikan pencarian NISN siap digunakan.
     */

    const inputNISN =
      document.getElementById(
        "inputNISN"
      );


    if (inputNISN) {

      inputNISN.addEventListener(
        "keydown",
        function(event) {

          if (
            event.key === "Enter"
          ) {

            event.preventDefault();

            cariSiswaNISN();

          }

        }
      );

    }

  }
);


/************************************************************
 * ==========================================================
 * PENYIMPANAN ANTREAN
 * ==========================================================
 */


/*
 * Memuat antrean dari localStorage.
 */

function muatAntreanLokal() {

  try {

    const data =
      localStorage.getItem(
        STORAGE_KEY
      );


    if (!data) {

      antreanAbsensi = [];

      qrDalamAntrean =
        new Set();

      return true;

    }


    const hasil =
      JSON.parse(data);


    if (
      Array.isArray(hasil)
    ) {

      antreanAbsensi =
        hasil;

      qrDalamAntrean =
        new Set(
          hasil.map(
            function(item) {

              return item.qr;

            }
          )
        );

    }

    else {

      antreanAbsensi = [];

      qrDalamAntrean =
        new Set();

    }


    return true;

  }

  catch(error) {

    console.error(
      "Penyimpanan lokal tidak dapat digunakan:",
      error
    );


    antreanAbsensi = [];

    qrDalamAntrean =
      new Set();


    tampilkanStatusPenyimpananGagal();


    return false;

  }

}


/************************************************************
 * SIMPAN ANTREAN KE HP
 ************************************************************/

function simpanAntreanLokal() {

  try {

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(
        antreanAbsensi
      )
    );


    return true;

  }

  catch(error) {

    console.error(
      "Gagal menyimpan antrean:",
      error
    );


    return false;

  }

}


/************************************************************
 * TAMPILKAN STATUS ANTREAN
 ************************************************************/

function perbaruiStatusAntrean() {

  const el =
    document.getElementById(
      "statusAntrean"
    );


  if (!el) {

    return;

  }


  if (
    antreanAbsensi.length === 0
  ) {

    el.textContent =
      "☁️ Semua data tersimpan";

  }

  else {

    el.textContent =
      "☁️ " +
      antreanAbsensi.length +
      " data sedang dikirim...";

  }

}


/************************************************************
 * STATUS PENYIMPANAN GAGAL
 ************************************************************/

function tampilkanStatusPenyimpananGagal() {

  const el =
    document.getElementById(
      "statusAntrean"
    );


  if (!el) {

    return;

  }


  el.textContent =
    "⚠️ Penyimpanan HP tidak tersedia";

}


/************************************************************
 * ==========================================================
 * INDIKATOR SCANNER
 * ==========================================================
 */


/************************************************************
 * TAMPILKAN INDIKATOR
 ************************************************************/

function tampilkanIndikator(
  jenis,
  icon,
  teks
) {

  const indikator =
    document.getElementById(
      "indikatorScan"
    );


  const iconEl =
    document.getElementById(
      "indikatorIcon"
    );


  const textEl =
    document.getElementById(
      "indikatorText"
    );


  if (
    !indikator ||
    !iconEl ||
    !textEl
  ) {

    return;

  }


  indikator.className =
    "indikator-scan " +
    jenis;


  iconEl.textContent =
    icon;


  textEl.textContent =
    teks;

}


/************************************************************
 * SIAP SCAN
 ************************************************************/

function indikatorSiapScan() {

  tampilkanIndikator(
    "siap",
    "📷",
    "SIAP SCAN"
  );

}


/************************************************************
 * SCAN BERHASIL DITERIMA
 ************************************************************/

function indikatorScanBerhasil() {

  tampilkanIndikator(
    "berhasil",
    "✓",
    "BERHASIL!"
  );


  setTimeout(
    function() {

      if (
        scannerAktif
      ) {

        indikatorSiapScan();

      }

    },
    700
  );

}


/************************************************************
 * PERINGATAN
 ************************************************************/

function indikatorWarning(
  teks
) {

  tampilkanIndikator(
    "warning",
    "⚠️",
    teks
  );


  setTimeout(
    function() {

      if (
        scannerAktif
      ) {

        indikatorSiapScan();

      }

    },
    1200
  );

}


/************************************************************
 * ERROR
 ************************************************************/

function indikatorError(
  teks
) {

  tampilkanIndikator(
    "error",
    "✕",
    teks
  );


  setTimeout(
    function() {

      if (
        scannerAktif
      ) {

        indikatorSiapScan();

      }

    },
    1200
  );

}


/************************************************************
 * ==========================================================
 * AMBIL STATUS HARI INI
 * ==========================================================
 */

async function muatStatus() {

  try {

    const response =
      await fetch(
        API_URL +
        "?action=status"
      );


    const data =
      await response.json();


    console.log(
      "STATUS SERVER:",
      data
    );


    if (
      data.status !==
      "success"
    ) {

      throw new Error(
        data.message ||
        "Status gagal dimuat."
      );

    }


    document.getElementById(
      "tanggal"
    ).textContent =
      data.tanggal || "-";


    document.getElementById(
      "hari"
    ).textContent =
      data.hari || "-";


    document.getElementById(
      "jam"
    ).textContent =
      data.jam || "-";


    document.getElementById(
      "kelompok"
    ).textContent =
      data.kelompokMinggu || "-";

  }

  catch(error) {

    console.error(
      "Gagal memuat status:",
      error
    );


    document.getElementById(
      "tanggal"
    ).textContent =
      "-";


    document.getElementById(
      "hari"
    ).textContent =
      "-";


    document.getElementById(
      "jam"
    ).textContent =
      "-";


    document.getElementById(
      "kelompok"
    ).textContent =
      "-";

  }

}


/************************************************************
 * ==========================================================
 * UPDATE JAM BERKALA
 * ==========================================================
 */

setInterval(
  muatStatus,
  30000
);


/************************************************************
 * ==========================================================
 * AMBIL GURU PIKET HARI INI
 * ==========================================================
 */

async function muatGuruPiket() {

  const select =
    document.getElementById(
      "guruPiket"
    );


  const status =
    document.getElementById(
      "guruStatus"
    );


  select.innerHTML =
    '<option value="">Memuat guru piket...</option>';


  status.textContent =
    "Memuat data guru piket...";


  try {

    const response =
      await fetch(
        API_URL +
        "?action=guru_piket"
      );


    const data =
      await response.json();


    console.log(
      "GURU PIKET SERVER:",
      data
    );


    select.innerHTML =
      '<option value="">-- Pilih Guru Piket --</option>';


    if (
      data.status !==
      "success"
    ) {

      throw new Error(
        data.message ||
        "Data guru piket gagal dimuat."
      );

    }


    if (
      !Array.isArray(
        data.data
      ) ||
      data.data.length === 0
    ) {

      select.innerHTML =
        '<option value="">Tidak ada guru piket</option>';


      status.textContent =
        "Tidak ada guru piket aktif untuk hari ini.";


      return;

    }


    data.data.forEach(
      function(guru) {

        const option =
          document.createElement(
            "option"
          );


        option.value =
          guru.nama || "";


        option.textContent =
          guru.nama || "-";


        select.appendChild(
          option
        );

      }
    );


    status.textContent =
      data.data.length +
      " guru piket aktif hari ini.";

  }

  catch(error) {

    console.error(
      "Gagal memuat guru piket:",
      error
    );


    select.innerHTML =
      '<option value="">Gagal memuat guru</option>';


    status.textContent =
      "Gagal memuat data guru piket.";

  }

}


/************************************************************
 * ==========================================================
 * MULAI SCANNER
 * ==========================================================
 */

async function mulaiScanner() {

  if (
    scannerAktif
  ) {

    return;

  }


  const guru =
    document.getElementById(
      "guruPiket"
    ).value.trim();


  if (!guru) {

    tampilkanNotifikasi(
      "⚠️ Pilih guru piket terlebih dahulu.",
      "warning"
    );


    tampilkanHasil(
      "warning",
      "⚠️ Guru piket belum dipilih",
      "Silakan pilih nama guru piket terlebih dahulu."
    );


    indikatorWarning(
      "PILIH GURU PIKET"
    );


    bunyiPeringatan();


    return;

  }


  /*
   * Pastikan penyimpanan lokal dapat digunakan
   * sebelum scanner mulai menerima QR.
   */

  let storageSiap = true;


  try {

    const testKey =
      "__absensi_qr_test__";


    localStorage.setItem(
      testKey,
      "1"
    );


    localStorage.removeItem(
      testKey
    );

  }

  catch(error) {

    storageSiap = false;

  }


  if (!storageSiap) {

    indikatorError(
      "PENYIMPANAN GAGAL"
    );


    bunyiGagal();


    tampilkanNotifikasi(
      "❌ Penyimpanan HP tidak tersedia. Kamera tidak dijalankan untuk mencegah data hilang.",
      "error"
    );


    return;

  }


  const status =
    document.getElementById(
      "scannerStatus"
    );


  try {

    scanner =
      new Html5Qrcode(
        "reader"
      );


    await scanner.start(

      {
        facingMode:
          "environment"
      },

      {
        fps: 10,

        qrbox:
          function(
            width,
            height
          ) {

            const size =
              Math.min(
                width,
                height
              ) * 0.70;


            return {
              width: size,
              height: size
            };

          }

      },

      ketikaQRTerbaca,

      function(errorMessage) {

        /*
         * Error scan biasa diabaikan.
         */

      }

    );


    scannerAktif =
      true;


    document.getElementById(
      "btnStart"
    ).style.display =
      "none";


    document.getElementById(
      "btnStop"
    ).style.display =
      "block";


    status.textContent =
      "🟢 Kamera aktif — siap scan QR.";


    indikatorSiapScan();


    /*
     * Coba kirim antrean lama
     * ketika kamera mulai.
     */

    prosesAntreanAbsensi();

  }

  catch(error) {

    console.error(
      "KAMERA:",
      error
    );


    scannerAktif =
      false;


    status.textContent =
      "Kamera tidak dapat dibuka.";


    indikatorError(
      "KAMERA GAGAL"
    );


    bunyiGagal();


    tampilkanNotifikasi(
      "⚠️ Kamera tidak dapat dibuka.",
      "error"
    );


    tampilkanHasil(
      "error",
      "⚠️ Kamera gagal dibuka",
      "Pastikan izin kamera browser sudah diberikan dan halaman dibuka melalui HTTPS."
    );

  }

}

/************************************************************
 * ==========================================================
 * QR TERBACA
 * ==========================================================
 *
 * PERBEDAAN UTAMA DENGAN KODE LAMA:
 *
 * QR TIDAK MENUNGGU FETCH.
 *
 * QR langsung:
 *
 * 1. Masuk antrean
 * 2. Disimpan ke HP
 * 3. Bunyi
 * 4. Indikator hijau
 * 5. Counter bertambah
 * 6. Kamera siap scan berikutnya
 *
 * Pengiriman ke server berlangsung di belakang layar.
 *
 ************************************************************
 */

async function ketikaQRTerbaca(
  qr
) {

  qr =
    String(
      qr || ""
    ).trim();


  if (!qr) {

    return;

  }


  const sekarang =
    Date.now();


  /*
   * Cegah QR yang sama terbaca
   * berulang ketika masih berada di kamera.
   */

  if (
    qr === qrTerakhir &&
    (
      sekarang -
      waktuScanTerakhir
    ) <
    JEDA_QR_SAMA
  ) {

    return;

  }


  qrTerakhir =
    qr;


  waktuScanTerakhir =
    sekarang;


  /*
   * Pastikan guru piket masih dipilih.
   */

  const guru =
    document.getElementById(
      "guruPiket"
    ).value.trim();


  if (!guru) {

    indikatorWarning(
      "PILIH GURU PIKET"
    );


    bunyiPeringatan();


    tampilkanNotifikasi(
      "⚠️ Pilih guru piket terlebih dahulu.",
      "warning"
    );


    return;

  }


  /*
   * Jika QR yang sama masih berada
   * di antrean, jangan masukkan lagi.
   */

  if (
    qrDalamAntrean.has(qr)
  ) {

    return;

  }


  /*
   * Buat item antrean.
   */

  const item = {

    id:
      "Q-" +
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .substring(2, 8),

    qr:
      qr,

    guruPiket:
      guru,

    waktuScan:
      new Date().toISOString(),

    tanggalScan:
      buatTanggalLokal()

  };


  /*
   * Masukkan ke antrean.
   */

  antreanAbsensi.push(
    item
  );


  qrDalamAntrean.add(
    qr
  );


  /*
   * Simpan TERLEBIH DAHULU
   * sebelum memberikan tanda berhasil.
   */

  const tersimpan =
    simpanAntreanLokal();


  /*
   * Jika tidak bisa disimpan,
   * jangan berpura-pura aman.
   */

  if (!tersimpan) {

    antreanAbsensi =
      antreanAbsensi.filter(
        function(x) {

          return x.id !== item.id;

        }
      );


    qrDalamAntrean.delete(
      qr
    );


    indikatorError(
      "PENYIMPANAN GAGAL"
    );


    bunyiGagal();


    tampilkanNotifikasi(
      "❌ Penyimpanan HP gagal. Scan tidak diterima agar data tidak hilang.",
      "error"
    );


    tampilkanHasil(
      "error",
      "❌ PENYIMPANAN GAGAL",
      "Scan tidak dimasukkan ke antrean. Periksa penyimpanan HP sebelum melanjutkan."
    );


    return;

  }


  /*
   * ======================================================
   * QR SUDAH AMAN DI ANTREAN
   * ======================================================
   *
   * Mulai saat ini kamera boleh langsung membaca
   * QR berikutnya.
   */


  jumlahBerhasil++;


  const counter =
    document.getElementById(
      "jumlahBerhasil"
    );


  if (counter) {

    counter.textContent =
      jumlahBerhasil;

  }


  /*
   * FEEDBACK SUPER CEPAT
   */

  indikatorScanBerhasil();


  bunyiBerhasil();


  /*
   * Tampilkan hasil ringan.
   * Tidak menunggu server.
   */

  tampilkanHasil(
    "success",
    "✓ QR DITERIMA",
    `
      QR berhasil dibaca dan sudah masuk antrean.
      <div class="ready-message">
        📷 Siap scan QR berikutnya
      </div>
    `
  );


  perbaruiStatusAntrean();


  /*
   * Kirim ke server di latar belakang.
   *
   * Tidak menggunakan await di sini.
   */

  prosesAntreanAbsensi();

}


/************************************************************
 * ==========================================================
 * PROSES ANTREAN KE APPS SCRIPT
 * ==========================================================
 */

async function prosesAntreanAbsensi() {

  /*
   * Jika sudah ada proses pengiriman,
   * jangan buat proses kedua.
   */

  if (
    pengirimanBerjalan
  ) {

    return;

  }


  if (
    antreanAbsensi.length === 0
  ) {

    perbaruiStatusAntrean();

    return;

  }


  pengirimanBerjalan =
    true;


  try {

    while (
      antreanAbsensi.length > 0
    ) {

      const item =
        antreanAbsensi[0];


      /*
       * ==================================================
       * CEK TANGGAL
       * ==================================================
       *
       * Kita TIDAK mengirim otomatis antrean
       * dari tanggal sebelumnya.
       *
       * Alasannya:
       * Code.gs sekarang menggunakan tanggal server
       * saat request diterima.
       */

      const tanggalHariIni =
        buatTanggalLokal();


      if (
        item.tanggalScan &&
        item.tanggalScan !==
        tanggalHariIni
      ) {

        tampilkanStatusAntreanLama();

        break;

      }


      /*
       * ==================================================
       * KIRIM KE SERVER
       * ==================================================
       */

      try {

        const payload = {

          action:
            "simpan_absensi",

          qr:
            item.qr,

          guruPiket:
            item.guruPiket

        };


        console.log(
          "KIRIM ANTREAN ABSENSI:",
          payload
        );


        const response =
          await fetch(
            API_URL,
            {

              method:
                "POST",

              headers: {

                "Content-Type":
                  "text/plain;charset=utf-8"

              },

              body:
                JSON.stringify(
                  payload
                )

            }
          );


        if (
          !response.ok
        ) {

          throw new Error(
            "Server HTTP " +
            response.status
          );

        }


        const data =
          await response.json();


        console.log(
          "RESPONS ANTREAN:",
          data
        );


        /*
         * =================================================
         * SERVER BERHASIL
         * =================================================
         */

        if (
          data &&
          data.status ===
          "success"
        ) {

          /*
           * Hapus item dari antrean.
           */

          antreanAbsensi.shift();


          qrDalamAntrean.delete(
            item.qr
          );


          /*
           * Simpan perubahan antrean.
           */

          simpanAntreanLokal();


          perbaruiStatusAntrean();


          /*
           * Jika ada data murid,
           * tampilkan informasi terakhir
           * secara ringan.
           */

          if (
            data.data
          ) {

            const murid =
              data.data;


            tampilkanHasil(
              "success",
              "☁️ ABSENSI TERSIMPAN",
              `
                <strong>
                  ${escapeHTML(
                    murid.nama || "-"
                  )}
                </strong>
                <br>

                NISN:
                ${escapeHTML(
                  String(
                    murid.nisn || "-"
                  )
                )}
                <br>

                Kelas:
                ${escapeHTML(
                  murid.kelas || "-"
                )}
                <br>

                Jam:
                ${escapeHTML(
                  murid.jam || "-"
                )}
                <br>

                Status:
                <strong>
                  ${escapeHTML(
                    murid.status || "-"
                  )}
                </strong>

                <div class="ready-message">
                  📷 Siap scan QR berikutnya
                </div>
              `
            );

          }


          continue;

        }


        /*
         * =================================================
         * SUDAH ABSEN
         * =================================================
         *
         * Untuk antrean, kondisi ini dianggap selesai.
         *
         * Ini penting:
         * bisa saja server sebenarnya sudah menyimpan,
         * tetapi respons pertama tidak sampai ke HP.
         *
         * Ketika dicoba lagi, server mengatakan
         * "sudah melakukan absensi".
         *
         * Kita tidak boleh retry terus-menerus.
         */

        if (
          data &&
          data.status ===
          "error" &&
          data.message &&
          data.message
            .toLowerCase()
            .includes(
              "sudah melakukan absensi"
            )
        ) {

          antreanAbsensi.shift();


          qrDalamAntrean.delete(
            item.qr
          );


          simpanAntreanLokal();


          perbaruiStatusAntrean();


          /*
           * Jangan munculkan popup besar.
           * Cukup tampilkan status ringan.
           */

          indikatorWarning(
            "SUDAH ABSEN"
          );


          continue;

        }


        /*
         * =================================================
         * ERROR DARI SERVER
         * =================================================
         *
         * Jangan hapus dari antrean.
         */

        console.error(
          "SERVER MENOLAK ANTREAN:",
          data
        );


        tampilkanStatusAntreanGagal(
          data &&
          data.message
            ? data.message
            : "Server menolak data."
        );


        break;

      }

      catch(error) {

        /*
         * Internet / server gagal.
         *
         * Item TIDAK DIHAPUS.
         */

        console.error(
          "PENGIRIMAN ANTREAN GAGAL:",
          error
        );


        tampilkanStatusAntreanGagal(
          "Koneksi belum tersedia"
        );


        break;

      }

    }

  }

  finally {

    pengirimanBerjalan =
      false;


    perbaruiStatusAntrean();

  }

}


/************************************************************
 * ==========================================================
 * TANGGAL LOKAL HP
 * ==========================================================
 */

function buatTanggalLokal() {

  const sekarang =
    new Date();


  const tahun =
    sekarang.getFullYear();


  const bulan =
    String(
      sekarang.getMonth() + 1
    ).padStart(
      2,
      "0"
    );


  const hari =
    String(
      sekarang.getDate()
    ).padStart(
      2,
      "0"
    );


  return (
    tahun +
    "-" +
    bulan +
    "-" +
    hari
  );

}

/************************************************************
 * ==========================================================
 * BUNYI BERHASIL
 * ==========================================================
 */

function bunyiBerhasil() {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;


    if (!AudioContext) {

      return;

    }


    const ctx =
      new AudioContext();


    /*
     * BIP PERTAMA
     */

    const oscillator1 =
      ctx.createOscillator();


    const gain1 =
      ctx.createGain();


    oscillator1.type =
      "sine";


    oscillator1.frequency.setValueAtTime(
      880,
      ctx.currentTime
    );


    gain1.gain.setValueAtTime(
      0.0001,
      ctx.currentTime
    );


    gain1.gain.exponentialRampToValueAtTime(
      0.18,
      ctx.currentTime + 0.02
    );


    gain1.gain.exponentialRampToValueAtTime(
      0.0001,
      ctx.currentTime + 0.13
    );


    oscillator1.connect(
      gain1
    );


    gain1.connect(
      ctx.destination
    );


    oscillator1.start();


    oscillator1.stop(
      ctx.currentTime + 0.14
    );


    /*
     * BIP KEDUA
     */

    const oscillator2 =
      ctx.createOscillator();


    const gain2 =
      ctx.createGain();


    oscillator2.type =
      "sine";


    oscillator2.frequency.setValueAtTime(
      1174,
      ctx.currentTime + 0.17
    );


    gain2.gain.setValueAtTime(
      0.0001,
      ctx.currentTime + 0.17
    );


    gain2.gain.exponentialRampToValueAtTime(
      0.18,
      ctx.currentTime + 0.19
    );


    gain2.gain.exponentialRampToValueAtTime(
      0.0001,
      ctx.currentTime + 0.30
    );


    oscillator2.connect(
      gain2
    );


    gain2.connect(
      ctx.destination
    );


    oscillator2.start(
      ctx.currentTime + 0.17
    );


    oscillator2.stop(
      ctx.currentTime + 0.31
    );


    oscillator2.onended =
      function() {

        ctx.close();

      };

  }

  catch(error) {

    console.log(
      "Bunyi berhasil tidak tersedia:",
      error
    );

  }

}

function bunyiGagal() {

/************************************************************
 * ==========================================================
 * ESCAPE HTML
 * ==========================================================
 */

function escapeHTML(
  text
) {

  return String(
    text == null
      ? ""
      : text
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}

async function cariSiswaNISN() {

  const input =

      "inputNISN"
    );


  const hasil =
    document.getElementById(
      "hasilPencarianNISN"
    );


  if (
    !input ||
    !hasil
  ) {

    console.error(
      "Elemen pencarian NISN tidak ditemukan."
    );


    return;

  }


  const nisn =
    String(
      input.value || ""
    ).trim();


  if (!nisn) {

    hasil.style.display =
      "block";


    hasil.style.background =
      "#fef3c7";


    hasil.style.color =
      "#92400e";


    hasil.innerHTML =
      "⚠️ Silakan masukkan NISN terlebih dahulu.";


    input.focus();


    return;

  }


  /* ==================================================
     CEK GURU PIKET
  ================================================== */

  const guruPiketElement =
    document.getElementById(
      "guruPiket"
    );


  const guruPiket =
    guruPiketElement
      ? String(
          guruPiketElement.value ||
          ""
        ).trim()
      : "";


  if (!guruPiket) {

    hasil.style.display =
      "block";


    hasil.style.background =
      "#fef3c7";


    hasil.style.color =
      "#92400e";


    hasil.innerHTML =
      "⚠️ Silakan pilih guru piket terlebih dahulu.";


    if (
      guruPiketElement
    ) {

      guruPiketElement.focus();

    }


    return;

  }


  /* ==================================================
     TAMPILKAN STATUS MENCARI
  ================================================== */

  hasil.style.display =
    "block";


  hasil.style.background =
    "#f8fafc";


  hasil.style.color =
    "#1e293b";


  hasil.innerHTML =
    "⏳ Mencari data siswa...";


  try {

    /* ==================================================
       1. CARI SISWA BERDASARKAN NISN
    ================================================== */

    const responseCari =
      await fetch(
        API_URL +
        "?action=cari_siswa&nisn=" +
        encodeURIComponent(
          nisn
        )
      );


    if (
      !responseCari.ok
    ) {

      throw new Error(
        "Server HTTP " +
        responseCari.status
      );

    }


    const dataCari =
      await responseCari.json();


    console.log(
      "HASIL CARI NISN:",
      dataCari
    );


    if (
      !dataCari ||
      dataCari.status !==
      "success"
    ) {

      hasil.style.background =
        "#fee2e2";


      hasil.style.color =
        "#991b1b";


      hasil.innerHTML =
        "❌ " +
        escapeHTML(
          dataCari &&
          dataCari.message
            ? dataCari.message
            : "Siswa tidak ditemukan."
        );


      return;

    }


    const murid =
      dataCari.data ||
      {};


    /* ==================================================
       2. TAMPILKAN IDENTITAS SISWA
    ================================================== */

    hasil.style.background =
      "#dcfce7";


    hasil.style.color =
      "#166534";


    hasil.innerHTML =

      "<strong style='font-size:19px;'>" +

      escapeHTML(
        murid.nama || "-"
      ) +

      "</strong>" +

      "<br>NISN: " +

      escapeHTML(
        String(
          murid.nisn || "-"
        )
      ) +

      "<br>Kelas: " +

      escapeHTML(
        murid.kelas || "-"
      ) +

      "<br>Program Keahlian: " +

      escapeHTML(
        murid.programKeahlian || "-"
      ) +

      "<br><br>⏳ Menyimpan absensi...";


    /* ==================================================
       3. SIMPAN ABSENSI
    ================================================== */

    const payload = {

      action:
        "simpan_absensi_nisn",

      nisn:
        String(
          murid.nisn ||
          nisn
        ).trim(),

      guruPiket:
        guruPiket

    };


    console.log(
      "POST ABSENSI NISN:",
      payload
    );


    const responseAbsensi =
      await fetch(
        API_URL,
        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "text/plain;charset=utf-8"

          },

          body:
            JSON.stringify(
              payload
            )

        }
      );


    if (
      !responseAbsensi.ok
    ) {

      throw new Error(
        "Server HTTP " +
        responseAbsensi.status
      );

    }


    const dataAbsensi =
      await responseAbsensi.json();


    console.log(
      "RESPONS ABSENSI NISN:",
      dataAbsensi
    );


    /* ==================================================
       4. ABSENSI BERHASIL
    ================================================== */

    if (
      dataAbsensi &&
      dataAbsensi.status ===
      "success"
    ) {

      jumlahBerhasil++;


      document.getElementById(
        "jumlahBerhasil"
      ).textContent =
        jumlahBerhasil;


      hasil.style.background =
        "#dcfce7";


      hasil.style.color =
        "#166534";


      hasil.innerHTML =

        "<strong style='font-size:20px;'>" +

        "✅ ABSENSI BERHASIL" +

        "</strong>" +

        "<br><br>" +

        "<strong>" +

        escapeHTML(
          dataAbsensi.murid &&
          dataAbsensi.murid.nama
            ? dataAbsensi.murid.nama
            : murid.nama
        ) +

        "</strong>" +

        "<br>NISN: " +

        escapeHTML(
          String(
            dataAbsensi.murid &&
            dataAbsensi.murid.nisn
              ? dataAbsensi.murid.nisn
              : murid.nisn
          )
        ) +

        "<br>Kelas: " +

        escapeHTML(
          dataAbsensi.murid &&
          dataAbsensi.murid.kelas
            ? dataAbsensi.murid.kelas
            : murid.kelas
        ) +

        "<br>Jam: " +

        escapeHTML(
          dataAbsensi.jam ||
          "-"
        ) +

        "<br>Guru Piket: " +

        escapeHTML(
          dataAbsensi.guruPiket ||
          guruPiket
        ) +

        "<br>Status: <strong>" +

        escapeHTML(
          dataAbsensi.statusAbsensi ||
          "Hadir"
        ) +

        "</strong>";


      tampilkanNotifikasi(
        "✅ ABSENSI BERHASIL — " +
        (
          murid.nama ||
          ""
        ),
        "berhasil"
      );


      bunyiBerhasil();


      input.value = "";


      return;

    }


    /* ==================================================
       5. SUDAH ABSEN
    ================================================== */

    if (
      dataAbsensi &&
      dataAbsensi.status ===
      "warning"
    ) {

      jumlahSudah++;


      hasil.style.background =
        "#fef3c7";


      hasil.style.color =
        "#92400e";


      hasil.innerHTML =

        "<strong style='font-size:19px;'>" +

        "⚠️ SUDAH ABSEN" +

        "</strong>" +

        "<br><br>" +

        escapeHTML(
          dataAbsensi.message ||
          "Murid sudah melakukan absensi hari ini."
        ) +

        (
          dataAbsensi.jam
            ? "<br>Jam: " +
              escapeHTML(
                dataAbsensi.jam
              )
            : ""
        );


      tampilkanNotifikasi(
        "⚠️ " +
        (
          dataAbsensi.message ||
          "Murid sudah absen hari ini."
        ),
        "warning"
      );


      return;

    }


    /* ==================================================
       6. ABSENSI GAGAL
    ================================================== */

    hasil.style.background =
      "#fee2e2";


    hasil.style.color =
      "#991b1b";


    hasil.innerHTML =

      "❌ " +

      escapeHTML(
        dataAbsensi &&
        dataAbsensi.message
          ? dataAbsensi.message
          : "Absensi gagal disimpan."
      );


    tampilkanNotifikasi(
      "❌ Absensi gagal.",
      "error"
    );


  }

  catch(error) {

    console.error(
      "ABSENSI NISN ERROR:",
      error
    );


    hasil.style.display =
      "block";


    hasil.style.background =
      "#fee2e2";


    hasil.style.color =
      "#991b1b";


    hasil.innerHTML =

      "❌ Gagal menghubungi server." +

      "<br><small>" +

      escapeHTML(
        error.message ||
        "Periksa koneksi internet."
      ) +

      "</small>";


    tampilkanNotifikasi(
      "❌ Koneksi ke server gagal.",
      "error"
    );

  }

}


</script>

</body>
</html>
