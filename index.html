<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Absensi QR Murid - SMK Negeri 1 Palopo</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }

    .container {
      width: 100%;
      max-width: 650px;
      margin: auto;
      padding: 15px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,.08);
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: 24px;
      color: #0f172a;
    }

    .subtitle {
      text-align: center;
      margin-top: 6px;
      color: #64748b;
      font-size: 15px;
    }

    .info {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 20px;
    }

    .info-box {
      background: #f8fafc;
      border-radius: 10px;
      padding: 12px;
      text-align: center;
    }

    .label {
      display: block;
      font-size: 12px;
      color: #64748b;
      margin-bottom: 4px;
    }

    .value {
      display: block;
      font-weight: bold;
      font-size: 16px;
      color: #0f172a;
    }

    .guru-title {
      font-weight: bold;
      margin-bottom: 8px;
      display: block;
    }

    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 16px;
      background: white;
    }

    .guru-status {
      margin-top: 10px;
      font-size: 13px;
      color: #64748b;
      text-align: center;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: auto;
      overflow: hidden;
      border-radius: 12px;
    }

    .scanner-status {
      text-align: center;
      margin-top: 10px;
      font-size: 14px;
      color: #64748b;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 14px;
      margin-top: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-start {
      background: #16a34a;
      color: white;
    }

    .btn-stop {
      background: #dc2626;
      color: white;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .result {
      display: none;
      padding: 16px;
      border-radius: 12px;
      margin-top: 15px;
      line-height: 1.6;
    }

    .result.success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .result.warning {
      display: block;
      background: #fef3c7;
      color: #92400e;
    }

    .result.error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .result-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .counter {
      text-align: center;
      color: #64748b;
      font-size: 14px;
    }

    .counter strong {
      display: inline-block;
      font-size: 20px;
      color: #166534;
      margin-left: 4px;
    }

    .loading {
      text-align: center;
      color: #64748b;
      padding: 8px;
    }

    .ready-message {
      margin-top: 10px;
      font-size: 13px;
      opacity: .8;
    }

    /* NOTIFIKASI */
    #notifikasi {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      width: calc(100% - 30px);
      max-width: 480px;
      padding: 15px;
      border-radius: 12px;
      text-align: center;
      font-size: 17px;
      font-weight: bold;
      opacity: 0;
      pointer-events: none;
      transition: .2s ease;
      z-index: 9999;
      box-shadow: 0 5px 20px rgba(0,0,0,.2);
    }

    #notifikasi.tampil {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    #notifikasi.berhasil {
      background: #16a34a;
      color: white;
    }

    #notifikasi.warning {
      background: #f59e0b;
      color: white;
    }

    #notifikasi.error {
      background: #dc2626;
      color: white;
    }

    /* =====================================================
       PENCARIAN NISN
    ===================================================== */

    .nisn-title {
      font-weight: bold;
      font-size: 17px;
      margin-bottom: 10px;
    }

    .nisn-row {
      display: flex;
      gap: 8px;
    }

    #inputNISN {
      flex: 1;
      min-width: 0;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    #inputNISN:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37,99,235,.12);
    }

    .btn-cari-nisn {
      width: auto;
      margin-top: 0;
      padding: 13px 16px;
      background: #2563eb;
      color: white;
      white-space: nowrap;
    }

    #hasilPencarianNISN {
      display: none;
      margin-top: 12px;
      padding: 14px;
      border-radius: 10px;
      line-height: 1.7;
    }

    @media (max-width: 480px) {

      .container {
        padding: 10px;
      }

      .card {
        padding: 15px;
      }

      h1 {
        font-size: 21px;
      }

      .info {
        gap: 7px;
      }

      .nisn-row {
        flex-direction: column;
      }

      .btn-cari-nisn {
        width: 100%;
        margin-top: 8px;
      }
    }
  </style>
</head>

<body>

  <!-- NOTIFIKASI -->
  <div id="notifikasi"></div>

  <div class="container">

    <!-- HEADER / STATUS -->
    <div class="card">

      <h1>📷 Absensi QR Murid</h1>

      <div class="subtitle">
        SMK Negeri 1 Palopo
      </div>

      <div class="info">

        <div class="info-box">
          <span class="label">Tanggal</span>
          <span class="value" id="tanggal">-</span>
        </div>

        <div class="info-box">
          <span class="label">Hari</span>
          <span class="value" id="hari">-</span>
        </div>

        <div class="info-box">
          <span class="label">Jam</span>
          <span class="value" id="jam">-</span>
        </div>

        <div class="info-box">
          <span class="label">Kelompok Minggu</span>
          <span class="value" id="kelompok">-</span>
        </div>

      </div>

    </div>


    <!-- GURU PIKET -->
    <div class="card">

      <span class="guru-title">
        👨‍🏫 Guru Piket
      </span>

      <select id="guruPiket">

        <option value="">
          Memuat guru piket...
        </option>

      </select>

      <div
        id="guruStatus"
        class="guru-status">
        Memuat data guru piket...
      </div>

    </div>


    <!-- SCANNER -->
    <div class="card">

      <div id="reader"></div>

      <div
        id="scannerStatus"
        class="scanner-status">
        Kamera belum dimulai.
      </div>

      <button
        id="btnStart"
        class="btn-start"
        onclick="mulaiScanner()">
        📷 Mulai Kamera
      </button>

      <button
        id="btnStop"
        class="btn-stop"
        onclick="hentikanScanner()"
        style="display:none;">
        ⏹ Hentikan Kamera
      </button>

    </div>


    <!-- HASIL SCAN -->
    <div
      id="hasil"
      class="result">

      <div
        id="hasilJudul"
        class="result-title">
      </div>

      <div id="hasilIsi"></div>

    </div>


    <!-- COUNTER -->
    <div class="card">

      <div class="counter">

        Scan berhasil:

        <strong id="jumlahBerhasil">
          0
        </strong>

      </div>

    </div>


    <!-- ===================================================
         PENCARIAN SISWA BERDASARKAN NISN
    ==================================================== -->

    <div class="card">

      <div class="nisn-title">
        🔎 Cari Siswa Berdasarkan NISN
      </div>

      <div class="nisn-row">

        <input
          type="text"
          id="inputNISN"
          inputmode="numeric"
          maxlength="20"
          placeholder="Masukkan NISN siswa"
          autocomplete="off"
        >

        <button
          type="button"
          class="btn-cari-nisn"
          onclick="cariSiswaNISN()">
          ✅ Absen dengan NISN
        </button>

      </div>

      <div
        id="hasilPencarianNISN">
      </div>

    </div>

  </div>


<script>

/************************************************************
 * ==========================================================
 * KONFIGURASI
 * ==========================================================
 */

const API_URL =
  "https://script.google.com/macros/s/AKfycbzV1PeyqDcgfj7SysWZUN_MKGFFWkmtoi9rB_Bw8PsRXrKHnJRZRYzjMpMcTXHDEljb/exec";


/************************************************************
 * VARIABEL
 ************************************************************/

let scanner = null;

let scannerAktif = false;

let sedangMemproses = false;

let jumlahBerhasil = 0;

let qrTerakhir = "";

let waktuScanTerakhir = 0;

const JEDA_QR_SAMA = 3000;

let timerNotifikasi = null;


/************************************************************
 * SAAT HALAMAN DIBUKA
 ************************************************************/

window.addEventListener(
  "load",
  function() {

    muatStatus();

    muatGuruPiket();

    /*
     * Pastikan pencarian NISN siap digunakan
     */
    const inputNISN =
      document.getElementById("inputNISN");

    if (inputNISN) {

      inputNISN.addEventListener(
        "keydown",
        function(event) {

          if (event.key === "Enter") {

            event.preventDefault();

            cariSiswaNISN();

          }

        }
      );

    }

  }
);


/************************************************************
 * AMBIL STATUS HARI INI
 ************************************************************/

async function muatStatus() {

  try {

    const response =
      await fetch(
        API_URL +
        "?action=status"
      );

    const data =
      await response.json();

    console.log(
      "STATUS SERVER:",
      data
    );

    if (
      data.status !== "success"
    ) {

      throw new Error(
        data.message ||
        "Status gagal dimuat."
      );

    }

    document.getElementById(
      "tanggal"
    ).textContent =
      data.tanggal || "-";

    document.getElementById(
      "hari"
    ).textContent =
      data.hari || "-";

    document.getElementById(
      "jam"
    ).textContent =
      data.jam || "-";

    document.getElementById(
      "kelompok"
    ).textContent =
      data.kelompokMinggu || "-";

  }

  catch(error) {

    console.error(
      "Gagal memuat status:",
      error
    );

    document.getElementById(
      "tanggal"
    ).textContent = "-";

    document.getElementById(
      "hari"
    ).textContent = "-";

    document.getElementById(
      "jam"
    ).textContent = "-";

    document.getElementById(
      "kelompok"
    ).textContent = "-";

  }

}


/************************************************************
 * UPDATE JAM BERKALA
 ************************************************************/

setInterval(
  muatStatus,
  30000
);


/************************************************************
 * AMBIL GURU PIKET HARI INI
 ************************************************************/

async function muatGuruPiket() {

  const select =
    document.getElementById(
      "guruPiket"
    );

  const status =
    document.getElementById(
      "guruStatus"
    );

  select.innerHTML =
    '<option value="">Memuat guru piket...</option>';

  status.textContent =
    "Memuat data guru piket...";

  try {

    const response =
      await fetch(
        API_URL +
        "?action=guru_piket"
      );

    const data =
      await response.json();

    console.log(
      "GURU PIKET SERVER:",
      data
    );

    select.innerHTML =
      '<option value="">-- Pilih Guru Piket --</option>';

    if (
      data.status !== "success"
    ) {

      throw new Error(
        data.message ||
        "Data guru piket gagal dimuat."
      );

    }

    if (
      !Array.isArray(
        data.data
      ) ||
      data.data.length === 0
    ) {

      select.innerHTML =
        '<option value="">Tidak ada guru piket</option>';

      status.textContent =
        "Tidak ada guru piket aktif untuk hari ini.";

      return;

    }

    data.data.forEach(
      function(guru) {

        const option =
          document.createElement(
            "option"
          );

        option.value =
          guru.nama || "";

        option.textContent =
          guru.nama || "-";

        select.appendChild(
          option
        );

      }
    );

    status.textContent =
      data.data.length +
      " guru piket aktif hari ini.";

  }

  catch(error) {

    console.error(
      "Gagal memuat guru piket:",
      error
    );

    select.innerHTML =
      '<option value="">Gagal memuat guru</option>';

    status.textContent =
      "Gagal memuat data guru piket.";

  }

}


/************************************************************
 * MULAI SCANNER
 ************************************************************/

async function mulaiScanner() {

  if (
    scannerAktif
  ) {

    return;

  }


  const guru =
    document.getElementById(
      "guruPiket"
    ).value.trim();


  if (!guru) {

    tampilkanNotifikasi(
      "⚠️ Pilih guru piket terlebih dahulu.",
      "warning"
    );

    tampilkanHasil(
      "warning",
      "⚠️ Guru piket belum dipilih",
      "Silakan pilih nama guru piket terlebih dahulu."
    );

    return;

  }


  const status =
    document.getElementById(
      "scannerStatus"
    );


  try {

    scanner =
      new Html5Qrcode(
        "reader"
      );


    await scanner.start(

      {
        facingMode:
          "environment"
      },

      {
        fps: 10,

        qrbox:
          function(width, height) {

            const size =
              Math.min(
                width,
                height
              ) * 0.70;

            return {
              width: size,
              height: size
            };

          }

      },

      ketikaQRTerbaca,

      function(errorMessage) {

        // Error scan biasa diabaikan.

      }

    );


    scannerAktif = true;

    document.getElementById(
      "btnStart"
    ).style.display =
      "none";

    document.getElementById(
      "btnStop"
    ).style.display =
      "block";

    status.textContent =
      "🟢 Kamera aktif — siap scan QR.";

  }

  catch(error) {

    console.error(
      "KAMERA:",
      error
    );

    scannerAktif = false;

    status.textContent =
      "Kamera tidak dapat dibuka.";

    tampilkanNotifikasi(
      "⚠️ Kamera tidak dapat dibuka.",
      "error"
    );

    tampilkanHasil(
      "error",
      "⚠️ Kamera gagal dibuka",
      "Pastikan izin kamera browser sudah diberikan dan halaman dibuka melalui HTTPS."
    );

  }

}


/************************************************************
 * HENTIKAN SCANNER
 ************************************************************/

async function hentikanScanner() {

  try {

    if (
      scanner &&
      scannerAktif
    ) {

      await scanner.stop();

      await scanner.clear();

    }

  }

  catch(error) {

    console.error(
      "STOP SCANNER:",
      error
    );

  }


  scannerAktif = false;

  scanner = null;

  document.getElementById(
    "btnStart"
  ).style.display =
    "block";

  document.getElementById(
    "btnStop"
  ).style.display =
    "none";

  document.getElementById(
    "scannerStatus"
  ).textContent =
    "Kamera dihentikan.";

}


/************************************************************
 * QR TERBACA
 ************************************************************/

async function ketikaQRTerbaca(qr) {

  qr =
    String(
      qr || ""
    ).trim();


  if (!qr) {

    return;

  }


  const sekarang =
    Date.now();


  if (
    qr === qrTerakhir &&
    (
      sekarang -
      waktuScanTerakhir
    ) <
    JEDA_QR_SAMA
  ) {

    return;

  }


  if (
    sedangMemproses
  ) {

    return;

  }


  qrTerakhir = qr;

  waktuScanTerakhir =
    sekarang;

  sedangMemproses = true;


  const guru =
    document.getElementById(
      "guruPiket"
    ).value.trim();


  if (!guru) {

    sedangMemproses = false;

    tampilkanNotifikasi(
      "⚠️ Pilih guru piket terlebih dahulu.",
      "warning"
    );

    return;

  }


  tampilkanHasil(
    "warning",
    "⏳ Memproses QR...",
    "Mengirim data absensi ke server..."
  );


  try {

    const payload = {

      action:
        "simpan_absensi",

      qr:
        qr,

      guruPiket:
        guru

    };


    console.log(
      "POST ABSENSI:",
      payload
    );


    const response =
      await fetch(
        API_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body:
            JSON.stringify(
              payload
            )
        }
      );


    if (
      !response.ok
    ) {

      throw new Error(
        "Server HTTP " +
        response.status
      );

    }


    const data =
      await response.json();


    console.log(
      "RESPONS ABSENSI:",
      data
    );


    prosesHasilScan(
      data
    );

  }

  catch(error) {

    console.error(
      "POST ABSENSI ERROR:",
      error
    );

    bunyiGagal();

    tampilkanNotifikasi(
      "❌ Koneksi gagal.",
      "error"
    );

    tampilkanHasil(
      "error",
      "❌ GAGAL MENGHUBUNGI SERVER",
      "Periksa koneksi internet kemudian coba scan kembali."
    );

  }

  finally {

    sedangMemproses =
      false;

  }

}


/************************************************************
 * PROSES HASIL SERVER
 ************************************************************/

function prosesHasilScan(
  data
) {

  if (!data) {

    bunyiGagal();

    tampilkanHasil(
      "error",
      "❌ TIDAK ADA RESPONS",
      "Server tidak memberikan respons."
    );

    return;

  }


  console.log(
    "DATA SERVER:",
    data
  );


  if (
    data.status ===
    "success"
  ) {

    jumlahBerhasil++;

    document.getElementById(
      "jumlahBerhasil"
    ).textContent =
      jumlahBerhasil;


    bunyiBerhasil();

    tampilkanNotifikasi(
      "✅ ABSENSI BERHASIL",
      "berhasil"
    );


    const murid =
      data.data ||
      {};


    tampilkanHasil(

      "success",

      "✅ ABSENSI BERHASIL",

      `
        <strong>
          ${escapeHTML(
            murid.nama || "-"
          )}
        </strong>
        <br>

        NISN:
        ${escapeHTML(
          String(
            murid.nisn || "-"
          )
        )}
        <br>

        Kelas:
        ${escapeHTML(
          murid.kelas || "-"
        )}
        <br>

        Jam:
        ${escapeHTML(
          murid.jam || "-"
        )}
        <br>

        Guru Piket:
        ${escapeHTML(
          murid.guruPiket || "-"
        )}
        <br>

        Status:
        <strong>
          ${escapeHTML(
            murid.status || "-"
          )}
        </strong>

        <div class="ready-message">
          📷 Siap scan QR berikutnya
        </div>
      `

    );

    return;

  }


  bunyiGagal();


  tampilkanNotifikasi(
    "❌ " +
    (
      data.message ||
      "Absensi gagal."
    ),
    "error"
  );


  tampilkanHasil(

    "error",

    "❌ ABSENSI GAGAL",

    escapeHTML(
      data.message ||
      "Terjadi kesalahan saat menyimpan absensi."
    )

  );

}


/************************************************************
 * NOTIFIKASI CEPAT
 ************************************************************/

function tampilkanNotifikasi(
  pesan,
  tipe
) {

  const box =
    document.getElementById(
      "notifikasi"
    );


  if (
    timerNotifikasi
  ) {

    clearTimeout(
      timerNotifikasi
    );

  }


  box.textContent =
    pesan;

  box.className =
    "tampil " +
    tipe;


  timerNotifikasi =
    setTimeout(
      function() {

        box.className = "";

        timerNotifikasi =
          null;

      },
      tipe === "berhasil"
        ? 1000
        : 1800
    );

}


/************************************************************
 * TAMPILKAN HASIL
 ************************************************************/

function tampilkanHasil(
  tipe,
  judul,
  isi
) {

  const box =
    document.getElementById(
      "hasil"
    );


  const title =
    document.getElementById(
      "hasilJudul"
    );


  const content =
    document.getElementById(
      "hasilIsi"
    );


  box.className =
    "result " +
    tipe;


  title.textContent =
    judul;


  content.innerHTML =
    isi;


  box.style.display =
    "block";

}


/************************************************************
 * BUNYI BERHASIL
 ************************************************************/

function bunyiBerhasil() {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;


    if (!AudioContext) {

      return;

    }


    const ctx =
      new AudioContext();


    const oscillator =
      ctx.createOscillator();


    const gain =
      ctx.createGain();


    oscillator.type =
      "sine";


    oscillator.frequency.setValueAtTime(
      880,
      ctx.currentTime
    );


    oscillator.frequency.setValueAtTime(
      1174,
      ctx.currentTime + 0.10
    );


    gain.gain.setValueAtTime(
      0.0001,
      ctx.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
      0.18,
      ctx.currentTime + 0.02
    );


    gain.gain.exponentialRampToValueAtTime(
      0.0001,
      ctx.currentTime + 0.28
    );


    oscillator.connect(
      gain
    );

    gain.connect(
      ctx.destination
    );


    oscillator.start();

    oscillator.stop(
      ctx.currentTime + 0.30
    );


    oscillator.onended =
      function() {

        ctx.close();

      };

  }

  catch(error) {

    console.log(
      "Bunyi berhasil tidak tersedia:",
      error
    );

  }

}


/************************************************************
 * BUNYI PERINGATAN
 ************************************************************/

function bunyiPeringatan() {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;


    if (!AudioContext) {

      return;

    }


    const ctx =
      new AudioContext();


    const oscillator =
      ctx.createOscillator();


    const gain =
      ctx.createGain();


    oscillator.type =
      "sine";


    oscillator.frequency.setValueAtTime(
      500,
      ctx.currentTime
    );


    gain.gain.setValueAtTime(
      0.0001,
      ctx.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
      0.15,
      ctx.currentTime + 0.02
    );


    gain.gain.exponentialRampToValueAtTime(
      0.0001,
      ctx.currentTime + 0.20
    );


    oscillator.connect(
      gain
    );

    gain.connect(
      ctx.destination
    );


    oscillator.start();

    oscillator.stop(
      ctx.currentTime + 0.22
    );


    oscillator.onended =
      function() {

        ctx.close();

      };

  }

  catch(error) {

    console.log(
      "Bunyi peringatan tidak tersedia:",
      error
    );

  }

}

/************************************************************
 * ESCAPE HTML
 ************************************************************/

function escapeHTML(text) {

  return String(
    text == null
      ? ""
      : text
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/************************************************************
 * ==========================================================
 * PENCARIAN SISWA BERDASARKAN NISN
 * ==========================================================
 */

async function cariSiswaNISN() {

  const input =
    document.getElementById("inputNISN");

  const hasil =
    document.getElementById("hasilPencarianNISN");


  if (!input || !hasil) {

    console.error(
      "Elemen pencarian NISN tidak ditemukan."
    );

    return;

  }


  const nisn =
    String(
      input.value || ""
    ).trim();


  if (!nisn) {

    hasil.style.display = "block";

    hasil.style.background = "#fef3c7";

    hasil.style.color = "#92400e";

    hasil.innerHTML =
      "⚠️ Silakan masukkan NISN terlebih dahulu.";

    input.focus();

    return;

  }


  /* ==================================================
     CEK GURU PIKET
  ================================================== */

  const guruPiketElement =
    document.getElementById("guruPiket");

  const guruPiket =
    guruPiketElement
      ? String(
          guruPiketElement.value || ""
        ).trim()
      : "";


  if (!guruPiket) {

    hasil.style.display = "block";

    hasil.style.background = "#fef3c7";

    hasil.style.color = "#92400e";

    hasil.innerHTML =
      "⚠️ Silakan pilih guru piket terlebih dahulu.";

    guruPiketElement.focus();

    return;

  }


  /* ==================================================
     TAMPILKAN STATUS MENCARI
  ================================================== */

  hasil.style.display = "block";

  hasil.style.background = "#f8fafc";

  hasil.style.color = "#1e293b";

  hasil.innerHTML =
    "⏳ Mencari data siswa...";


  try {

    /* ==================================================
       1. CARI SISWA BERDASARKAN NISN
    ================================================== */

    const responseCari =
      await fetch(
        API_URL +
        "?action=cari_siswa&nisn=" +
        encodeURIComponent(nisn)
      );


    if (!responseCari.ok) {

      throw new Error(
        "Server HTTP " +
        responseCari.status
      );

    }


    const dataCari =
      await responseCari.json();


    console.log(
      "HASIL CARI NISN:",
      dataCari
    );


    if (
      !dataCari ||
      dataCari.status !== "success"
    ) {

      hasil.style.background =
        "#fee2e2";

      hasil.style.color =
        "#991b1b";

      hasil.innerHTML =
        "❌ " +
        escapeHTML(
          dataCari &&
          dataCari.message
            ? dataCari.message
            : "Siswa tidak ditemukan."
        );

      return;

    }


    const murid =
      dataCari.data || {};


    /* ==================================================
       2. TAMPILKAN IDENTITAS SISWA
    ================================================== */

    hasil.style.background =
      "#dcfce7";

    hasil.style.color =
      "#166534";

    hasil.innerHTML =

      "<strong style='font-size:19px;'>" +

      escapeHTML(
        murid.nama || "-"
      ) +

      "</strong>" +

      "<br>NISN: " +

      escapeHTML(
        String(
          murid.nisn || "-"
        )
      ) +

      "<br>Kelas: " +

      escapeHTML(
        murid.kelas || "-"
      ) +

      "<br>Program Keahlian: " +

      escapeHTML(
        murid.programKeahlian || "-"
      ) +

      "<br><br>⏳ Menyimpan absensi...";


    /* ==================================================
       3. SIMPAN ABSENSI
    ================================================== */

    const payload = {

      action:
        "simpan_absensi_nisn",

      nisn:
        String(
          murid.nisn || nisn
        ).trim(),

      guruPiket:
        guruPiket

    };


    console.log(
      "POST ABSENSI NISN:",
      payload
    );


    const responseAbsensi =
      await fetch(
        API_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body:
            JSON.stringify(
              payload
            )
        }
      );


    if (!responseAbsensi.ok) {

      throw new Error(
        "Server HTTP " +
        responseAbsensi.status
      );

    }


    const dataAbsensi =
      await responseAbsensi.json();


    console.log(
      "RESPONS ABSENSI NISN:",
      dataAbsensi
    );


    /* ==================================================
       4. ABSENSI BERHASIL
    ================================================== */

    if (
      dataAbsensi &&
      dataAbsensi.status === "success"
    ) {

      jumlahBerhasil++;

      document.getElementById(
        "jumlahBerhasil"
      ).textContent =
        jumlahBerhasil;


      hasil.style.background =
        "#dcfce7";

      hasil.style.color =
        "#166534";


      hasil.innerHTML =

        "<strong style='font-size:20px;'>" +

        "✅ ABSENSI BERHASIL" +

        "</strong>" +

        "<br><br>" +

        "<strong>" +

        escapeHTML(
          dataAbsensi.murid &&
          dataAbsensi.murid.nama
            ? dataAbsensi.murid.nama
            : murid.nama
        ) +

        "</strong>" +

        "<br>NISN: " +

        escapeHTML(
          String(
            dataAbsensi.murid &&
            dataAbsensi.murid.nisn
              ? dataAbsensi.murid.nisn
              : murid.nisn
          )
        ) +

        "<br>Kelas: " +

        escapeHTML(
          dataAbsensi.murid &&
          dataAbsensi.murid.kelas
            ? dataAbsensi.murid.kelas
            : murid.kelas
        ) +

        "<br>Jam: " +

        escapeHTML(
          dataAbsensi.jam || "-"
        ) +

        "<br>Guru Piket: " +

        escapeHTML(
          dataAbsensi.guruPiket ||
          guruPiket
        ) +

        "<br>Status: <strong>" +

        escapeHTML(
          dataAbsensi.statusAbsensi ||
          "Hadir"
        ) +

        "</strong>";


      tampilkanNotifikasi(
        "✅ ABSENSI BERHASIL — " +
        (murid.nama || ""),
        "berhasil"
      );


      bunyiBerhasil();


      /* Bersihkan input */

      input.value = "";


      return;

    }


    /* ==================================================
       5. SUDAH ABSEN
    ================================================== */

    if (
      dataAbsensi &&
      dataAbsensi.status === "warning"
    ) {

      jumlahSudah++;

      document.getElementById(
        "jumlahSudah"
      ).textContent =
        jumlahSudah;


      hasil.style.background =
        "#fef3c7";

      hasil.style.color =
        "#92400e";


      hasil.innerHTML =

        "<strong style='font-size:19px;'>" +

        "⚠️ SUDAH ABSEN" +

        "</strong>" +

        "<br><br>" +

        escapeHTML(
          dataAbsensi.message ||
          "Murid sudah melakukan absensi hari ini."
        ) +

        (
          dataAbsensi.jam
            ? "<br>Jam: " +
              escapeHTML(
                dataAbsensi.jam
              )
            : ""
        );


      tampilkanNotifikasi(
        "⚠️ " +
        (
          dataAbsensi.message ||
          "Murid sudah absen hari ini."
        ),
        "warning"
      );


      return;

    }


    /* ==================================================
       6. ABSENSI GAGAL
    ================================================== */

    hasil.style.background =
      "#fee2e2";

    hasil.style.color =
      "#991b1b";


    hasil.innerHTML =

      "❌ " +

      escapeHTML(
        dataAbsensi &&
        dataAbsensi.message
          ? dataAbsensi.message
          : "Absensi gagal disimpan."
      );


    tampilkanNotifikasi(
      "❌ Absensi gagal.",
      "error"
    );


  }

  catch(error) {

    console.error(
      "ABSENSI NISN ERROR:",
      error
    );


    hasil.style.display =
      "block";

    hasil.style.background =
      "#fee2e2";

    hasil.style.color =
      "#991b1b";


    hasil.innerHTML =

      "❌ Gagal menghubungi server." +

      "<br><small>" +

      escapeHTML(
        error.message ||
        "Periksa koneksi internet."
      ) +

      "</small>";


    tampilkanNotifikasi(
      "❌ Koneksi ke server gagal.",
      "error"
    );

  }

}
