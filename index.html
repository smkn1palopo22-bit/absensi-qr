<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Absensi QR Murid</title>

<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f5f9;
  color:#1e293b;
}

.container{
  max-width:520px;
  margin:auto;
  padding:16px;
}

.card{
  background:white;
  border-radius:18px;
  padding:18px;
  margin-bottom:15px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

h1{
  margin:0 0 5px;
  font-size:22px;
  text-align:center;
}

.subtitle{
  text-align:center;
  color:#64748b;
  font-size:14px;
  margin-bottom:15px;
}

.info{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.info div{
  background:#f8fafc;
  padding:10px;
  border-radius:10px;
  font-size:13px;
}

.label{
  color:#64748b;
  display:block;
  margin-bottom:3px;
}

.value{
  font-weight:bold;
}

select{
  width:100%;
  padding:13px;
  border:1px solid #cbd5e1;
  border-radius:10px;
  font-size:15px;
  background:white;
}

#reader{
  width:100%;
  overflow:hidden;
  border-radius:15px;
}

button{
  width:100%;
  padding:13px;
  border:0;
  border-radius:10px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
  margin-top:10px;
}

.btn-start{
  background:#2563eb;
  color:white;
}

.btn-stop{
  background:#dc2626;
  color:white;
}

.result{
  display:none;
  padding:15px;
  border-radius:12px;
  margin-top:15px;
  transition:all .2s ease;
}

.success{
  background:#dcfce7;
  color:#166534;
}

.warning{
  background:#fef3c7;
  color:#92400e;
}

.error{
  background:#fee2e2;
  color:#991b1b;
}

.result-title{
  font-size:20px;
  font-weight:bold;
  margin-bottom:5px;
}

.murid{
  margin-top:8px;
  line-height:1.6;
}

.counter{
  text-align:center;
  font-size:14px;
  color:#64748b;
  margin-top:10px;
}

.counter strong{
  font-size:16px;
}

.loading{
  text-align:center;
  color:#64748b;
  padding:10px;
}

/* NOTIFIKASI SCAN */

.scan-notif{
  animation:popIn .18s ease-out;
}

@keyframes popIn{
  0%{
    transform:scale(.96);
    opacity:.5;
  }

  100%{
    transform:scale(1);
    opacity:1;
  }
}

.success-icon{
  font-size:30px;
  margin-bottom:3px;
}

.success-message{
  font-size:22px;
  font-weight:bold;
}

.ready-message{
  margin-top:6px;
  font-size:13px;
  opacity:.8;
}

/* STATUS SCANNER */

.scanner-status{
  text-align:center;
  margin-top:10px;
  font-size:13px;
  color:#64748b;
}
</style>

</head>

<body>

<div class="container">

  <!-- ==========================================
       HEADER
  =========================================== -->

  <div class="card">

    <h1>📷 Absensi QR Murid</h1>

    <div class="subtitle">
      SMK Negeri 1 Palopo
    </div>

    <div class="info">

      <div>
        <span class="label">Tanggal</span>
        <span class="value" id="tanggal">-</span>
      </div>

      <div>
        <span class="label">Hari</span>
        <span class="value" id="hari">-</span>
      </div>

      <div>
        <span class="label">Jam</span>
        <span class="value" id="jam">-</span>
      </div>

      <div>
        <span class="label">Kelompok</span>
        <span class="value" id="kelompok">-</span>
      </div>

    </div>

  </div>


  <!-- ==========================================
       GURU PIKET
  =========================================== -->

  <div class="card">

    <label style="font-weight:bold;">
      Guru Piket
    </label>

    <br><br>

    <select id="guruPiket">

      <option value="">
        Memuat guru piket...
      </option>

    </select>

    <div id="guruStatus" class="loading">
      Memuat data guru piket...
    </div>

  </div>


  <!-- ==========================================
       SCANNER
  =========================================== -->

  <div class="card">

    <div id="reader"></div>

    <div
      id="scannerStatus"
      class="scanner-status">
      Kamera belum dimulai.
    </div>

    <button
      id="btnStart"
      class="btn-start"
      onclick="mulaiScanner()">
      📷 Mulai Kamera
    </button>

    <button
      id="btnStop"
      class="btn-stop"
      onclick="hentikanScanner()"
      style="display:none;">
      ⏹ Hentikan Kamera
    </button>

  </div>


  <!-- ==========================================
       HASIL SCAN
  =========================================== -->

  <div
    id="hasil"
    class="result">

    <div
      id="hasilJudul"
      class="result-title">
    </div>

    <div
      id="hasilIsi"
      class="murid">
    </div>

  </div>


  <!-- ==========================================
       COUNTER
  =========================================== -->

  <div class="counter">

    Scan berhasil:
    <strong id="jumlahBerhasil">0</strong>

  </div>

</div>


<script>

/******************************************************
 * URL APPS SCRIPT
 ******************************************************/

const API_URL =
"https://script.google.com/macros/s/AKfycbzV1PeyqDcgfj7SysWZUN_MKGFFWkmtoi9rB_Bw8PsRXrKHnJRZRYzjMpMcTXHDEljb/exec";


/******************************************************
 * VARIABEL SCANNER
 ******************************************************/

let scanner = null;

let scannerAktif = false;

let sedangMemproses = false;

let jumlahBerhasil = 0;

let qrTerakhir = "";

let waktuScanTerakhir = 0;


/*
 * Waktu minimum sebelum QR yang sama
 * boleh diproses kembali.
 */

const JEDA_QR_SAMA = 3000;


/*
 * Lama notifikasi sukses ditampilkan.
 */

const DURASI_NOTIF_SUKSES = 1500;


/*
 * Timer notifikasi.
 */

let timerNotifikasi = null;


/******************************************************
 * SAAT HALAMAN DIBUKA
 ******************************************************/

window.addEventListener(
  "load",
  function(){

    muatStatus();

    muatGuruPiket();

  }
);


/******************************************************
 * STATUS
 ******************************************************/

async function muatStatus(){

  try{

    const response =
      await fetch(
        API_URL +
        "?action=status",
        {
          method:"GET",
          cache:"no-store"
        }
      );


    const data =
      await response.json();


    if(
      data.status !==
      "success"
    ){

      throw new Error(
        data.message ||
        "Gagal mengambil status."
      );

    }


    document.getElementById(
      "tanggal"
    ).textContent =
      data.tanggal || "-";


    document.getElementById(
      "hari"
    ).textContent =
      data.hari || "-";


    document.getElementById(
      "jam"
    ).textContent =
      data.jam || "-";


    document.getElementById(
      "kelompok"
    ).textContent =
      data.kelompokMinggu || "-";

  }

  catch(error){

    console.error(
      "STATUS:",
      error
    );

  }

}


/******************************************************
 * GURU PIKET
 ******************************************************/

async function muatGuruPiket(){

  const select =
    document.getElementById(
      "guruPiket"
    );

  const status =
    document.getElementById(
      "guruStatus"
    );


  select.innerHTML =
    '<option value="">Memuat guru piket...</option>';


  status.textContent =
    "Mengambil data guru piket...";


  try{

    const response =
      await fetch(
        API_URL +
        "?action=guru_piket",
        {
          method:"GET",
          cache:"no-store"
        }
      );


    const text =
      await response.text();


    console.log(
      "RESPON GURU:",
      text
    );


    const data =
      JSON.parse(text);


    if(
      data.status !==
      "success"
    ){

      throw new Error(
        data.message ||
        "Gagal memuat guru piket."
      );

    }


    select.innerHTML =
      '<option value="">-- Pilih Guru Piket --</option>';


    if(
      !data.data ||
      data.data.length === 0
    ){

      select.innerHTML =
        '<option value="">Tidak ada guru piket hari ini</option>';


      status.textContent =
        "Tidak ada data guru piket.";


      return;

    }


    data.data.forEach(
      function(guru){

        const option =
          document.createElement(
            "option"
          );


        option.value =
          guru.nama;


        option.textContent =
          guru.nama;


        select.appendChild(
          option
        );

      }
    );


    status.textContent =
      data.data.length +
      " guru piket tersedia.";

  }

  catch(error){

    console.error(
      "GURU PIKET:",
      error
    );


    select.innerHTML =
      '<option value="">Gagal memuat guru piket</option>';


    status.textContent =
      "Gagal memuat guru piket. Muat ulang halaman.";

  }

}


/******************************************************
 * MULAI SCANNER
 ******************************************************/

async function mulaiScanner(){

  if(scannerAktif){

    return;

  }


  const guru =
    document.getElementById(
      "guruPiket"
    ).value;


  if(!guru){

    tampilkanHasil(
      "error",
      "⚠️ Guru piket belum dipilih.",
      "Silakan pilih nama guru piket terlebih dahulu."
    );

    return;

  }


  try{

    scanner =
      new Html5Qrcode(
        "reader"
      );


    await scanner.start(

      {
        facingMode:"environment"
      },

      {

        fps:10,

        qrbox:function(
          width,
          height
        ){

          const ukuran =
            Math.min(
              width,
              height
            ) * 0.70;


          return {

            width:ukuran,

            height:ukuran

          };

        },

        aspectRatio:1.0

      },

      ketikaQRTerbaca,

      function(errorMessage){

        /*
         * Pesan scan biasa sengaja diabaikan.
         */

      }

    );


    scannerAktif =
      true;


    document.getElementById(
      "btnStart"
    ).style.display =
      "none";


    document.getElementById(
      "btnStop"
    ).style.display =
      "block";


    document.getElementById(
      "scannerStatus"
    ).textContent =
      "🟢 Kamera aktif — siap scan QR.";

  }

  catch(error){

    console.error(
      "KAMERA:",
      error
    );


    tampilkanHasil(
      "error",
      "⚠️ Kamera tidak dapat dibuka.",
      "Pastikan browser memberikan izin kamera."
    );

  }

}


/******************************************************
 * HENTIKAN SCANNER
 ******************************************************/

async function hentikanScanner(){

  if(
    !scanner ||
    !scannerAktif
  ){

    return;

  }


  try{

    await scanner.stop();

    await scanner.clear();

  }

  catch(error){

    console.error(
      "STOP SCANNER:",
      error
    );

  }


  scannerAktif =
    false;


  document.getElementById(
    "btnStart"
  ).style.display =
    "block";


  document.getElementById(
    "btnStop"
  ).style.display =
    "none";


  document.getElementById(
    "scannerStatus"
  ).textContent =
    "Kamera dihentikan.";

}


/******************************************************
 * QR TERBACA
 ******************************************************/

async function ketikaQRTerbaca(
  qr
){

  const sekarang =
    Date.now();


  /*
   * Jika QR yang sama terbaca
   * berulang dalam waktu 3 detik,
   * abaikan.
   */

  if(

    qr === qrTerakhir

    &&

    sekarang -
    waktuScanTerakhir <
    JEDA_QR_SAMA

  ){

    return;

  }


  /*
   * Jika sedang mengirim
   * QR sebelumnya ke server,
   * jangan menerima QR baru
   * dulu.
   *
   * Ini mencegah dua request
   * bertabrakan.
   */

  if(sedangMemproses){

    return;

  }


  qrTerakhir =
    qr;


  waktuScanTerakhir =
    sekarang;


  sedangMemproses =
    true;


  const guru =
    document.getElementById(
      "guruPiket"
    ).value;


  if(!guru){

    sedangMemproses =
      false;


    tampilkanHasil(
      "error",
      "⚠️ Guru piket belum dipilih.",
      "Silakan pilih guru piket."
    );


    return;

  }


  /*
   * Tampilkan proses sebentar.
   */

  tampilkanHasil(
    "warning",
    "⏳ Memproses QR...",
    "Menyimpan absensi..."
  );


  try{

    const response =
      await fetch(
        API_URL,
        {

          method:"POST",

          headers:{
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body:JSON.stringify({

            action:
              "scan_otomatis",

            qr:
              qr,

            guruPiket:
              guru

          })

        }
      );


    const data =
      await response.json();


    /*
     * PROSES HASIL SERVER
     */

    prosesHasilScan(
      data
    );

  }

  catch(error){

    console.error(
      "SCAN ERROR:",
      error
    );


    tampilkanHasil(
      "error",
      "❌ Gagal menghubungi server.",
      "Periksa koneksi internet."
    );

  }

  finally{

    /*
     * Setelah request selesai,
     * scanner langsung siap menerima
     * QR berikutnya.
     */

    sedangMemproses =
      false;

  }

}


/******************************************************
 * PROSES HASIL SCAN
 ******************************************************/

function prosesHasilScan(
  data
){

  if(!data){

    tampilkanHasil(
      "error",
      "❌ Tidak ada respons server.",
      "Silakan coba scan kembali."
    );


    bunyiGagal();


    return;

  }


  /*
   * ================================================
   * BERHASIL
   * ================================================
   */

  if(
    data.status ===
    "success"
  ){

    jumlahBerhasil++;


    document.getElementById(
      "jumlahBerhasil"
    ).textContent =
      jumlahBerhasil;


    const murid =
      data.murid || {};


    /*
     * BUNYI BERHASIL
     */

    bunyiBerhasil();


    /*
     * NOTIFIKASI BERHASIL
     */

    tampilkanNotifikasiBerhasil(
      murid,
      data
    );


    return;

  }


  /*
   * ================================================
   * SUDAH ABSEN
   *
   * Tidak lagi dihitung sebagai
   * "Scan berhasil".
   * ================================================
   */

  if(
    data.status ===
    "warning"
  ){

    const murid =
      data.murid || {};


    bunyiPeringatan();


    tampilkanHasil(
      "warning",
      "⚠️ SUDAH ABSEN",
      `
      <strong>${escapeHTML(
        murid.nama || "-"
      )}</strong><br>

      Kelas:
      ${escapeHTML(
        murid.kelas || "-"
      )}<br>

      Jam absensi:
      ${escapeHTML(
        String(
          data.jam || "-"
        )
      )}<br>

      Status:
      ${escapeHTML(
        String(
          data.statusAbsensi ||
          "Sudah absen"
        )
      )}
      `
    );


    return;

  }


  /*
   * ================================================
   * ERROR
   * ================================================
   */

  bunyiGagal();


  tampilkanHasil(
    "error",
    "❌ ABSENSI GAGAL",
    escapeHTML(
      data.message ||
      "Terjadi kesalahan."
    )
  );

}


/******************************************************
 * NOTIFIKASI BERHASIL
 ******************************************************/

function tampilkanNotifikasiBerhasil(
  murid,
  data
){

  const box =
    document.getElementById(
      "hasil"
    );


  /*
   * Hapus timer sebelumnya.
   *
   * Ini penting supaya notifikasi
   * tidak saling bertabrakan.
   */

  if(timerNotifikasi){

    clearTimeout(
      timerNotifikasi
    );

    timerNotifikasi =
      null;

  }


  box.className =
    "result success scan-notif";


  document.getElementById(
    "hasilJudul"
  ).innerHTML =
    `
    <div class="success-icon">
      ✅
    </div>

    <div class="success-message">
      SCAN BERHASIL
    </div>
    `;


  document.getElementById(
    "hasilIsi"
  ).innerHTML =
    `
    <strong>${escapeHTML(
      murid.nama || "-"
    )}</strong><br>

    NISN:
    ${escapeHTML(
      String(
        murid.nisn || "-"
      )
    )}<br>

    Kelas:
    ${escapeHTML(
      murid.kelas || "-"
    )}<br>

    Jam:
    ${escapeHTML(
      data.jam || "-"
    )}<br>

    Status:
    <strong>${escapeHTML(
      data.statusAbsensi || "-"
    )}</strong>

    <div class="ready-message">
      📷 Siap scan QR berikutnya
    </div>
    `;


  box.style.display =
    "block";


  /*
   * Setelah 1,5 detik,
   * notifikasi tetap tidak mengganggu
   * scanner.
   */

  timerNotifikasi =
    setTimeout(
      function(){

        timerNotifikasi =
          null;

        /*
         * Jangan menghapus hasil secara
         * paksa jika QR baru sudah
         * menghasilkan pesan lain.
         */

      },
      DURASI_NOTIF_SUKSES
    );


  /*
   * Pastikan status kamera
   * tetap menunjukkan aktif.
   */

  if(scannerAktif){

    document.getElementById(
      "scannerStatus"
    ).textContent =
      "🟢 Kamera aktif — siap scan QR berikutnya.";

  }

}


/******************************************************
 * TAMPILKAN HASIL UMUM
 ******************************************************/

function tampilkanHasil(
  tipe,
  judul,
  isi
){

  const box =
    document.getElementById(
      "hasil"
    );


  if(timerNotifikasi){

    clearTimeout(
      timerNotifikasi
    );

    timerNotifikasi =
      null;

  }


  box.className =
    "result " +
    tipe +
    " scan-notif";


  document.getElementById(
    "hasilJudul"
  ).textContent =
    judul;


  document.getElementById(
    "hasilIsi"
  ).innerHTML =
    isi;


  box.style.display =
    "block";

}


/******************************************************
 * BUNYI BERHASIL
 *
 * Menggunakan Web Audio API.
 * Tidak membutuhkan file MP3.
 ******************************************************/

function bunyiBerhasil(){

  try{

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;


    if(!AudioContext){

      return;

    }


    const ctx =
      new AudioContext();


    const oscillator =
      ctx.createOscillator();


    const gain =
      ctx.createGain();


    oscillator.type =
      "sine";


    oscillator.frequency.setValueAtTime(
      880,
      ctx.currentTime
    );


    oscillator.frequency.setValueAtTime(
      1174,
      ctx.currentTime + 0.10
    );


    gain.gain.setValueAtTime(
      0.0001,
      ctx.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
      0.18,
      ctx.currentTime + 0.02
    );


    gain.gain.exponentialRampToValueAtTime(
      0.0001,
      ctx.currentTime + 0.28
    );


    oscillator.connect(gain);

    gain.connect(ctx.destination);


    oscillator.start();


    oscillator.stop(
      ctx.currentTime + 0.30
    );


    oscillator.onended =
      function(){

        ctx.close();

      };

  }

  catch(error){

    console.log(
      "Bunyi berhasil tidak tersedia:",
      error
    );

  }

}


/******************************************************
 * BUNYI PERINGATAN
 ******************************************************/

function bunyiPeringatan(){

  try{

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;


    if(!AudioContext){

      return;

    }


    const ctx =
      new AudioContext();


    const oscillator =
      ctx.createOscillator();


    const gain =
      ctx.createGain();


    oscillator.type =
      "sine";


    oscillator.frequency.setValueAtTime(
      500,
      ctx.currentTime
    );


    gain.gain.setValueAtTime(
      0.0001,
      ctx.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
      0.15,
      ctx.currentTime + 0.02
    );


    gain.gain.exponentialRampToValueAtTime(
      0.0001,
      ctx.currentTime + 0.20
    );


    oscillator.connect(gain);

    gain.connect(ctx.destination);


    oscillator.start();


    oscillator.stop(
      ctx.currentTime + 0.22
    );


    oscillator.onended =
      function(){

        ctx.close();

      };

  }

  catch(error){

    console.log(
      "Bunyi peringatan tidak tersedia:",
      error
    );

  }

}


/******************************************************
 * BUNYI GAGAL
 ******************************************************/

function bunyiGagal(){

  try{

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;


    if(!AudioContext){

      return;

    }


    const ctx =
      new AudioContext();


    const oscillator =
      ctx.createOscillator();


    const gain =
      ctx.createGain();


    oscillator.type =
      "square";


    oscillator.frequency.setValueAtTime(
      300,
      ctx.currentTime
    );


    gain.gain.setValueAtTime(
      0.0001,
      ctx.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
      0.12,
      ctx.currentTime + 0.02
    );


    gain.gain.exponentialRampToValueAtTime(
      0.0001,
      ctx.currentTime + 0.25
    );


    oscillator.connect(gain);

    gain.connect(ctx.destination);


    oscillator.start();


    oscillator.stop(
      ctx.currentTime + 0.27
    );


    oscillator.onended =
      function(){

        ctx.close();

      };

  }

  catch(error){

    console.log(
      "Bunyi gagal tidak tersedia:",
      error
    );

  }

}


/******************************************************
 * KEAMANAN TAMPILAN
 ******************************************************/

function escapeHTML(
  text
){

  return String(text)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/******************************************************
 * UPDATE JAM
 ******************************************************/

setInterval(
  muatStatus,
  30000
);

</script>
