<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rekap Absensi - SMK Negeri 1 Palopo</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  color: #1e293b;
}

.container {
  max-width: 1200px;
  margin: auto;
  padding: 20px;
}

/* =========================
   HEADER
========================= */

.header {
  background: white;
  border-radius: 18px;
  padding: 22px;
  margin-bottom: 18px;
  box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

.header h1 {
  margin: 0;
  text-align: center;
  font-size: 25px;
}

.header p {
  text-align: center;
  color: #64748b;
  margin: 8px 0 0;
}

/* =========================
   CARD
========================= */

.card {
  background: white;
  border-radius: 16px;
  padding: 18px;
  margin-bottom: 18px;
  box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

/* =========================
   FILTER
========================= */

.filter {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 12px;
}

label {
  display: block;
  font-weight: bold;
  margin-bottom: 6px;
}

select,
input,
button {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  font-size: 15px;
}

select,
input {
  border: 1px solid #cbd5e1;
  background: white;
}

button {
  border: none;
  background: #2563eb;
  color: white;
  font-weight: bold;
  cursor: pointer;
  margin-top: 24px;
}

button:hover {
  opacity: .9;
}

button:disabled {
  opacity: .6;
  cursor: not-allowed;
}

.info {
  margin-top: 12px;
  color: #64748b;
  font-size: 14px;
}

/* =========================
   RINGKASAN
========================= */

.ringkasan {
  display: grid;

  /* SEKARANG HANYA 4 KOTAK */
  grid-template-columns: repeat(4, 1fr);

  gap: 12px;
}

.box {
  padding: 18px;
  border-radius: 14px;
  text-align: center;
  background: #f8fafc;
}

.box .angka {
  font-size: 28px;
  font-weight: bold;
  margin-top: 6px;
}

.box .judul {
  font-size: 13px;
  color: #64748b;
}

/* =========================
   WARNA RINGKASAN
========================= */

.box.hadir {
  border-left: 5px solid #22c55e;
}

.box.terlambat {
  border-left: 5px solid #ef4444;
}

.box.perhatian {
  border-left: 5px solid #f59e0b;
}

/* =========================
   TABEL
========================= */

.tabel-container {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 900px;
}

th,
td {
  padding: 10px;
  border-bottom: 1px solid #e2e8f0;
  text-align: left;
  font-size: 14px;
}

th {
  background: #f8fafc;
  position: sticky;
  top: 0;
  z-index: 2;
}

/* =========================
   WARNA PERHATIAN
========================= */

.merah {
  background: #fee2e2 !important;
  color: #991b1b;
  font-weight: bold;
}

.kuning {
  background: #fef3c7 !important;
  color: #92400e;
  font-weight: bold;
}

.hijau {
  color: #166534;
  font-weight: bold;
}

/* =========================
   BADGE
========================= */

.badge {
  display: inline-block;
  padding: 5px 9px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: bold;
}

.badge-merah {
  background: #fecaca;
  color: #991b1b;
}

.badge-kuning {
  background: #fde68a;
  color: #92400e;
}

.badge-hijau {
  background: #bbf7d0;
  color: #166534;
}

/* =========================
   LOADING
========================= */

.loading {
  text-align: center;
  padding: 20px;
  color: #64748b;
}

/* =========================
   ERROR
========================= */

.error {
  background: #fee2e2;
  color: #991b1b;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 15px;
  display: none;
}

/* =========================
   EMPTY
========================= */

.empty {
  text-align: center;
  padding: 30px;
  color: #64748b;
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 800px) {

  .filter {
    grid-template-columns: 1fr;
  }

  button {
    margin-top: 0;
  }

  .ringkasan {
    grid-template-columns: 1fr 1fr;
  }

}

@media (max-width: 450px) {

  .ringkasan {
    grid-template-columns: 1fr;
  }

  .header h1 {
    font-size: 21px;
  }

}

</style>
</head>


<body>

<div class="container">

  <!-- =========================
       HEADER
  ========================== -->

  <div class="header">

    <h1>
      📊 REKAP ABSENSI MURID
    </h1>

    <p>
      SMK Negeri 1 Palopo
    </p>

  </div>


  <!-- =========================
       ERROR
  ========================== -->

  <div
    id="errorBox"
    class="error">
  </div>


  <!-- =========================
       FILTER
  ========================== -->

  <div class="card">

    <div class="filter">

      <div>

        <label for="tanggalAwal">
          Tanggal Awal
        </label>

        <input
          type="date"
          id="tanggalAwal">

      </div>


      <div>

        <label for="tanggalAkhir">
          Tanggal Akhir
        </label>

        <input
          type="date"
          id="tanggalAkhir">

      </div>


      <div>

        <label>
          &nbsp;
        </label>

        <button
          id="btnTampilkan"
          onclick="muatRekap()">

          🔄 Tampilkan Rekap

        </button>

      </div>

    </div>


    <div
      id="infoFilter"
      class="info">

      Menampilkan seluruh data.

    </div>

  </div>


  <!-- =========================
       RINGKASAN
  ========================== -->

  <div class="card">

    <div class="ringkasan">


      <!-- TOTAL MURID -->

      <div class="box">

        <div class="judul">
          👥 Total Murid
        </div>

        <div
          class="angka"
          id="totalMurid">

          0

        </div>

      </div>


      <!-- HADIR -->

      <div class="box hadir">

        <div class="judul">
          ✅ Hadir
        </div>

        <div
          class="angka"
          id="totalHadir">

          0

        </div>

      </div>


      <!-- TERLAMBAT -->

      <div class="box terlambat">

        <div class="judul">
          🔴 Terlambat
        </div>

        <div
          class="angka"
          id="totalTerlambat">

          0

        </div>

      </div>


      <!-- BUTUH PERHATIAN -->

      <div class="box perhatian">

        <div class="judul">
          ⚠️ Butuh Perhatian
        </div>

        <div
          class="angka"
          id="butuhPerhatian">

          0

        </div>

      </div>


    </div>

  </div>


  <!-- =========================
       TABEL REKAP
  ========================== -->

  <div class="card">

    <h2>
      Daftar Rekap Murid
    </h2>


    <div
      id="loading"
      class="loading">

      Memuat data rekap...

    </div>


    <div class="tabel-container">

      <table id="tabelRekap">

        <thead>

          <tr>

            <th>No</th>

            <th>Nama Murid</th>

            <th>NISN</th>

            <th>Kelas</th>

            <th>Hadir</th>

            <th>Terlambat</th>

            <th>Izin</th>

            <th>Sakit</th>

            <th>Alpa</th>

            <th>Persentase</th>

            <th>Perhatian</th>

          </tr>

        </thead>


        <tbody
          id="isiTabel">

        </tbody>

      </table>

    </div>

  </div>

</div>


<script>

/******************************************************
 * URL APPS SCRIPT
 ******************************************************/

const API_URL =
"https://script.google.com/macros/s/AKfycbzV1PeyqDcgfj7SysWZUN_MKGFFWkmtoi9rB_Bw8PsRXrKHnJRZRYzjMpMcTXHDEljb/exec";


/******************************************************
 * SAAT HALAMAN DIBUKA
 ******************************************************/

window.addEventListener(
  "load",
  function() {

    muatRekap();

  }
);


/******************************************************
 * MUAT REKAP
 ******************************************************/

async function muatRekap() {

  const loading =
    document.getElementById(
      "loading"
    );

  const errorBox =
    document.getElementById(
      "errorBox"
    );

  const tombol =
    document.getElementById(
      "btnTampilkan"
    );


  errorBox.style.display =
    "none";

  loading.style.display =
    "block";

  tombol.disabled =
    true;


  const tanggalAwal =
    document.getElementById(
      "tanggalAwal"
    ).value;


  const tanggalAkhir =
    document.getElementById(
      "tanggalAkhir"
    ).value;


  try {

    let url =
      API_URL +
      "?action=rekap_admin";


    /*
     * FILTER TANGGAL AWAL
     */

    if (tanggalAwal) {

      url +=
        "&tanggalAwal=" +
        encodeURIComponent(
          tanggalAwal
        );

    }


    /*
     * FILTER TANGGAL AKHIR
     */

    if (tanggalAkhir) {

      url +=
        "&tanggalAkhir=" +
        encodeURIComponent(
          tanggalAkhir
        );

    }


    console.log(
      "Memuat rekap:",
      url
    );


    const response =
      await fetch(
        url,
        {
          method: "GET",
          cache: "no-store"
        }
      );


    const text =
      await response.text();


    console.log(
      "RESPON REKAP:",
      text
    );


    let data;


    try {

      data =
        JSON.parse(text);

    }

    catch(e) {

      throw new Error(
        "Respons Apps Script bukan JSON yang valid."
      );

    }


    /*
     * CEK STATUS
     */

    if (
      data.status !==
      "success"
    ) {

      throw new Error(
        data.message ||
        "Gagal mengambil data rekap."
      );

    }


    /*
     * TAMPILKAN RINGKASAN
     */

    tampilkanRingkasan(
      data.ringkasan || {}
    );


    /*
     * TAMPILKAN TABEL
     */

    tampilkanTabel(
      data.data || []
    );


    /*
     * INFORMASI FILTER
     */

    if (
      tanggalAwal &&
      tanggalAkhir
    ) {

      document.getElementById(
        "infoFilter"
      ).textContent =
        "Menampilkan rekap dari " +
        formatTanggal(
          tanggalAwal
        ) +
        " sampai " +
        formatTanggal(
          tanggalAkhir
        ) +
        ".";

    }

    else if (
      tanggalAwal
    ) {

      document.getElementById(
        "infoFilter"
      ).textContent =
        "Menampilkan rekap mulai " +
        formatTanggal(
          tanggalAwal
        ) +
        ".";

    }

    else if (
      tanggalAkhir
    ) {

      document.getElementById(
        "infoFilter"
      ).textContent =
        "Menampilkan rekap sampai " +
        formatTanggal(
          tanggalAkhir
        ) +
        ".";

    }

    else {

      document.getElementById(
        "infoFilter"
      ).textContent =
        "Menampilkan seluruh data.";

    }

  }


  catch(error) {

    console.error(
      "REKAP ERROR:",
      error
    );


    errorBox.textContent =
      "❌ Gagal memuat rekap: " +
      error.message;


    errorBox.style.display =
      "block";


    document.getElementById(
      "isiTabel"
    ).innerHTML =
      `
      <tr>
        <td
          colspan="11"
          class="empty">

          Data rekap tidak dapat dimuat.

        </td>
      </tr>
      `;

  }


  finally {

    loading.style.display =
      "none";

    tombol.disabled =
      false;

  }

}


/******************************************************
 * TAMPILKAN RINGKASAN
 *
 * HANYA 4 DATA:
 *
 * Total Murid
 * Hadir
 * Terlambat
 * Butuh Perhatian
 ******************************************************/

function tampilkanRingkasan(
  ringkasan
) {

  document.getElementById(
    "totalMurid"
  ).textContent =
    Number(
      ringkasan.totalMurid || 0
    );


  document.getElementById(
    "totalHadir"
  ).textContent =
    Number(
      ringkasan.hadir || 0
    );


  document.getElementById(
    "totalTerlambat"
  ).textContent =
    Number(
      ringkasan.terlambat || 0
    );


  document.getElementById(
    "butuhPerhatian"
  ).textContent =
    Number(
      ringkasan.butuhPerhatian || 0
    );

}


/******************************************************
 * TAMPILKAN TABEL
 ******************************************************/

function tampilkanTabel(
  data
) {

  const tbody =
    document.getElementById(
      "isiTabel"
    );


  tbody.innerHTML =
    "";


  /*
   * TIDAK ADA DATA
   */

  if (
    !Array.isArray(data) ||
    data.length === 0
  ) {

    tbody.innerHTML =
      `
      <tr>

        <td
          colspan="11"
          class="empty">

          Tidak ada data rekap.

        </td>

      </tr>
      `;

    return;

  }


  /*
   * TAMPILKAN SEMUA MURID
   */

  data.forEach(
    function(item, index) {


      const tr =
        document.createElement(
          "tr"
        );


      const perhatian =
        item.perhatian || {};


      /*
       * TENTUKAN WARNA BARIS
       */

      let kelasWarna =
        "";


      if (
        perhatian.kode ===
        "MERAH"
      ) {

        kelasWarna =
          "merah";

      }

      else if (
        perhatian.kode ===
        "KUNING"
      ) {

        kelasWarna =
          "kuning";

      }

      else {

        kelasWarna =
          "hijau";

      }


      tr.className =
        kelasWarna;


      /*
       * BADGE PERHATIAN
       */

      let badgeClass =
        "badge-hijau";


      if (
        perhatian.kode ===
        "MERAH"
      ) {

        badgeClass =
          "badge-merah";

      }

      else if (
        perhatian.kode ===
        "KUNING"
      ) {

        badgeClass =
          "badge-kuning";

      }


      /*
       * DATA ANGKA
       */

      const hadir =
        Number(
          item.hadir || 0
        );


      const terlambat =
        Number(
          item.terlambat || 0
        );


      const izin =
        Number(
          item.izin || 0
        );


      const sakit =
        Number(
          item.sakit || 0
        );


      const alpa =
        Number(
          item.alpa || 0
        );


      const persentase =
        Number(
          item.persentase || 0
        );


      /*
       * BUAT BARIS
       */

      tr.innerHTML =
        `
        <td>
          ${index + 1}
        </td>

        <td>
          ${escapeHTML(
            item.nama || "-"
          )}
        </td>

        <td>
          ${escapeHTML(
            String(
              item.nisn || "-"
            )
          )}
        </td>

        <td>
          ${escapeHTML(
            item.kelas || "-"
          )}
        </td>

        <td>
          ${hadir}
        </td>

        <td>
          ${terlambat}
        </td>

        <td>
          ${izin}
        </td>

        <td>
          ${sakit}
        </td>

        <td>
          ${alpa}
        </td>

        <td>
          ${persentase}%
        </td>

        <td>

          <span
            class="badge ${badgeClass}">

            ${escapeHTML(
              perhatian.label ||
              "Baik"
            )}

          </span>

        </td>
        `;


      tbody.appendChild(
        tr
      );

    }
  );

}


/******************************************************
 * FORMAT TANGGAL
 ******************************************************/

function formatTanggal(
  tanggal
) {

  if (!tanggal) {
    return "-";
  }


  const bagian =
    tanggal.split("-");


  if (
    bagian.length !== 3
  ) {

    return tanggal;

  }


  return (
    bagian[2] +
    "/" +
    bagian[1] +
    "/" +
    bagian[0]
  );

}


/******************************************************
 * KEAMANAN HTML
 ******************************************************/

function escapeHTML(
  text
) {

  return String(text)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}

</script>

</body>
</html>
