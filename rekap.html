<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<title>
  Rekap Absensi - SMK Negeri 1 Palopo
</title>

<style>

/* =====================================================
   DASAR
===================================================== */

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background: #f1f5f9;

  color: #1e293b;
}

.container {

  max-width: 1250px;

  margin: auto;

  padding: 20px;
}


/* =====================================================
   HEADER
===================================================== */

.header {

  background: white;

  border-radius: 18px;

  padding: 22px;

  margin-bottom: 18px;

  box-shadow:
    0 3px 12px rgba(0,0,0,.08);
}

.header h1 {

  margin: 0;

  text-align: center;

  font-size: 25px;
}

.header p {

  text-align: center;

  color: #64748b;

  margin:
    8px
    0
    0;
}


/* =====================================================
   CARD
===================================================== */

.card {

  background: white;

  border-radius: 16px;

  padding: 18px;

  margin-bottom: 18px;

  box-shadow:
    0 3px 12px rgba(0,0,0,.08);
}


/* =====================================================
   FILTER
===================================================== */

.filter {

  display: grid;

  grid-template-columns:
    1fr
    1fr
    1fr;

  gap: 12px;
}

label {

  display: block;

  font-weight: bold;

  margin-bottom: 6px;
}

select,
input,
button {

  width: 100%;

  padding: 12px;

  border-radius: 10px;

  font-size: 15px;
}

select,
input {

  border:
    1px solid #cbd5e1;

  background: white;
}

button {

  border: none;

  background: #2563eb;

  color: white;

  font-weight: bold;

  cursor: pointer;

  margin-top: 24px;
}

button:hover {

  opacity: .9;
}

button:disabled {

  opacity: .6;

  cursor: wait;
}

.info {

  margin-top: 12px;

  color: #64748b;

  font-size: 14px;
}


/* =====================================================
   RINGKASAN
===================================================== */

.ringkasan {

  display: grid;

  grid-template-columns:
    repeat(4, 1fr);

  gap: 12px;
}

.box {

  padding: 18px;

  border-radius: 14px;

  text-align: center;

  background: #f8fafc;
}

.box .judul {

  font-size: 14px;

  color: #64748b;
}

.box .angka {

  font-size: 30px;

  font-weight: bold;

  margin-top: 7px;
}


/* =====================================================
   WARNA RINGKASAN
===================================================== */

.box.total {

  background: #eff6ff;
}

.box.hadir {

  background: #ecfdf5;
}

.box.terlambat {

  background: #fef2f2;
}

.box.perhatian {

  background: #fff7ed;
}


/* =====================================================
   TABEL
===================================================== */

.tabel-container {

  overflow-x: auto;
}

table {

  width: 100%;

  border-collapse: collapse;

  min-width: 950px;
}

th,
td {

  padding: 10px;

  border-bottom:
    1px solid #e2e8f0;

  text-align: left;

  font-size: 14px;
}

th {

  background: #f8fafc;

  position: sticky;

  top: 0;

  z-index: 2;
}


/* =====================================================
   BARIS STATUS
===================================================== */

tr.baris-merah {

  background: #fee2e2 !important;

  color: #991b1b;
}

tr.baris-merah td {

  font-weight: 600;
}

tr.baris-perhatian {

  background: #fecaca !important;

  color: #7f1d1d;
}

tr.baris-perhatian td {

  font-weight: bold;
}

tr.baris-hijau {

  background: white;
}


/* =====================================================
   BADGE
===================================================== */

.badge {

  display: inline-block;

  padding:
    5px
    9px;

  border-radius: 999px;

  font-size: 12px;

  font-weight: bold;

  white-space: nowrap;
}

.badge-hijau {

  background: #dcfce7;

  color: #166534;
}

.badge-merah {

  background: #fecaca;

  color: #991b1b;
}

.badge-perhatian {

  background: #ef4444;

  color: white;
}


/* =====================================================
   LOADING
===================================================== */

.loading {

  text-align: center;

  padding: 20px;

  color: #64748b;

  display: none;
}


/* =====================================================
   ERROR
===================================================== */

.error {

  background: #fee2e2;

  color: #991b1b;

  padding: 15px;

  border-radius: 10px;

  margin-bottom: 15px;

  display: none;
}


/* =====================================================
   HASIL INFO
===================================================== */

.hasil-info {

  margin-top: 12px;

  padding: 10px 12px;

  border-radius: 10px;

  background: #f8fafc;

  color: #475569;

  font-size: 14px;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media (max-width: 800px) {

  .filter {

    grid-template-columns: 1fr;
  }

  button {

    margin-top: 0;
  }

  .ringkasan {

    grid-template-columns:
      1fr
      1fr;
  }
}


@media (max-width: 450px) {

  .container {

    padding: 10px;
  }

  .header {

    padding: 18px 12px;
  }

  .header h1 {

    font-size: 20px;
  }

  .ringkasan {

    grid-template-columns: 1fr;
  }

}

</style>

</head>


<body>


<div class="container">


<!-- ==================================================
     HEADER
================================================== -->

<div class="header">

  <h1>
    📊 REKAP ABSENSI MURID
  </h1>

  <p>
    SMK Negeri 1 Palopo
  </p>

</div>


<!-- ==================================================
     ERROR
================================================== -->

<div
  id="errorBox"
  class="error">
</div>


<!-- ==================================================
     FILTER
================================================== -->

<div class="card">

  <div class="filter">


    <div>

      <label for="tanggalAwal">
        Tanggal Awal
      </label>

      <input
        type="date"
        id="tanggalAwal">

    </div>


    <div>

      <label for="tanggalAkhir">
        Tanggal Akhir
      </label>

      <input
        type="date"
        id="tanggalAkhir">

    </div>


    <div>

      <label>
        &nbsp;
      </label>

      <button
        id="btnMuat"
        onclick="muatRekap()">

        🔄 Tampilkan Rekap

      </button>

    </div>


  </div>


  <div
    id="infoFilter"
    class="info">

    Menampilkan seluruh data.

  </div>

</div>


<!-- ==================================================
     RINGKASAN
================================================== -->

<div class="card">

  <div class="ringkasan">


    <!-- TOTAL -->

    <div class="box total">

      <div class="judul">

        👥 Total Murid

      </div>

      <div
        class="angka"
        id="totalMurid">

        0

      </div>

    </div>


    <!-- HADIR -->

    <div class="box hadir">

      <div class="judul">

        ✅ Hadir

      </div>

      <div
        class="angka"
        id="totalHadir">

        0

      </div>

    </div>


    <!-- TERLAMBAT -->

    <div class="box terlambat">

      <div class="judul">

        🔴 Terlambat

      </div>

      <div
        class="angka"
        id="totalTerlambat">

        0

      </div>

    </div>


    <!-- PERHATIAN -->

    <div class="box perhatian">

      <div class="judul">

        ⚠️ Butuh Perhatian

      </div>

      <div
        class="angka"
        id="butuhPerhatian">

        0

      </div>

    </div>


  </div>


  <div
    id="hasilInfo"
    class="hasil-info">

    Menunggu data...

  </div>

</div>


<!-- ==================================================
     TABEL
================================================== -->

<div class="card">

  <h2>
    Daftar Rekap Murid
  </h2>


  <div
    id="loading"
    class="loading">

    ⏳ Memuat data rekap...

  </div>


  <div class="tabel-container">

    <table id="tabelRekap">


      <thead>

        <tr>

          <th>No</th>

          <th>Nama Murid</th>

          <th>NISN</th>

          <th>Kelas</th>

          <th>Hadir</th>

          <th>Terlambat</th>

          <th>Izin</th>

          <th>Sakit</th>

          <th>Alpa</th>

          <th>Persentase</th>

          <th>Perhatian</th>

        </tr>

      </thead>


      <tbody id="isiTabel">

      </tbody>


    </table>

  </div>

</div>


</div>


<script>


/* =====================================================
   URL APPS SCRIPT
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbzV1PeyqDcgfj7SysWZUN_MKGFFWkmtoi9rB_Bw8PsRXrKHnJRZRYzjMpMcTXHDEljb/exec";


/*
 * Jika URL di atas ternyata berbeda dengan URL
 * Apps Script yang sedang dipakai scanner,
 * ganti URL tersebut dengan URL Web App Apps Script
 * yang sama dengan scanner.
 */


/* =====================================================
   DATA GLOBAL
===================================================== */

let DATA_REKAP = [];


/* =====================================================
   SAAT HALAMAN DIBUKA
===================================================== */

window.addEventListener(
  "load",
  function() {

    muatRekap();

  }
);


/* =====================================================
   MUAT REKAP
===================================================== */

async function muatRekap() {


  const loading =
    document.getElementById(
      "loading"
    );


  const errorBox =
    document.getElementById(
      "errorBox"
    );


  const tombol =
    document.getElementById(
      "btnMuat"
    );


  const tanggalAwal =
    document.getElementById(
      "tanggalAwal"
    ).value;


  const tanggalAkhir =
    document.getElementById(
      "tanggalAkhir"
    ).value;


  errorBox.style.display =
    "none";


  loading.style.display =
    "block";


  tombol.disabled =
    true;


  tombol.textContent =
    "⏳ Memuat...";


  try {


    let url =
      API_URL +
      "?action=rekap_admin";


    if (
      tanggalAwal
    ) {

      url +=
        "&tanggalAwal=" +
        encodeURIComponent(
          tanggalAwal
        );

    }


    if (
      tanggalAkhir
    ) {

      url +=
        "&tanggalAkhir=" +
        encodeURIComponent(
          tanggalAkhir
        );

    }


    const response =
      await fetch(
        url,
        {
          method: "GET",
          cache: "no-store"
        }
      );


    if (
      !response.ok
    ) {

      throw new Error(
        "HTTP Error " +
        response.status
      );

    }


    const text =
      await response.text();


    console.log(
      "RESPON REKAP:",
      text
    );


    let data;


    try {

      data =
        JSON.parse(text);

    }

    catch(e) {

      throw new Error(
        "Respons Apps Script bukan JSON yang valid."
      );

    }


    if (
      data.status !==
      "success"
    ) {

      throw new Error(
        data.message ||
        "Gagal mengambil data rekap."
      );

    }


    DATA_REKAP =
      Array.isArray(
        data.data
      )
        ? data.data
        : [];


    /*
     * PENTING:
     *
     * Ringkasan tidak langsung mengambil
     * butuhPerhatian dari backend.
     *
     * Kita hitung ulang dari DATA_REKAP.
     */

    const ringkasan =
      hitungRingkasanDariData(
        DATA_REKAP
      );


    tampilkanRingkasan(
      ringkasan
    );


    tampilkanTabel(
      DATA_REKAP
    );


    if (
      tanggalAwal ||
      tanggalAkhir
    ) {

      document.getElementById(
        "infoFilter"
      ).textContent =
        "Rekap berdasarkan periode yang dipilih.";

    }

    else {

      document.getElementById(
        "infoFilter"
      ).textContent =
        "Menampilkan seluruh data.";

    }


    document.getElementById(
      "hasilInfo"
    ).textContent =
      "Data berhasil dimuat: " +
      DATA_REKAP.length +
      " murid.";


  }

  catch(error) {


    console.error(
      "REKAP ERROR:",
      error
    );


    errorBox.textContent =
      "❌ Gagal memuat rekap: " +
      error.message;


    errorBox.style.display =
      "block";


    document.getElementById(
      "hasilInfo"
    ).textContent =
      "Data gagal dimuat.";


  }

  finally {


    loading.style.display =
      "none";


    tombol.disabled =
      false;


    tombol.textContent =
      "🔄 Tampilkan Rekap";

  }

}


/* =====================================================
   HITUNG RINGKASAN DARI DATA MURID
===================================================== */

function hitungRingkasanDariData(
  data
) {


  let totalMurid =
    data.length;


  let totalHadir =
    0;


  let totalTerlambat =
    0;


  let butuhPerhatian =
    0;


  data.forEach(
    function(item) {


      const hadir =
        Number(
          item.hadir || 0
        );


      const terlambat =
        Number(
          item.terlambat || 0
        );


      totalHadir +=
        hadir;


      totalTerlambat +=
        terlambat;


      /*
       * 3 kali atau lebih
       * = BUTUH PERHATIAN
       */

      if (
        terlambat >= 3
      ) {

        butuhPerhatian++;

      }

    }
  );


  return {

    totalMurid:
      totalMurid,

    hadir:
      totalHadir,

    terlambat:
      totalTerlambat,

    butuhPerhatian:
      butuhPerhatian

  };

}


/* =====================================================
   TAMPILKAN RINGKASAN
===================================================== */

function tampilkanRingkasan(
  ringkasan
) {


  document.getElementById(
    "totalMurid"
  ).textContent =
    ringkasan.totalMurid || 0;


  document.getElementById(
    "totalHadir"
  ).textContent =
    ringkasan.hadir || 0;


  document.getElementById(
    "totalTerlambat"
  ).textContent =
    ringkasan.terlambat || 0;


  /*
   * Nilai ini berasal dari perhitungan
   * ulang DATA_REKAP.
   */

  document.getElementById(
    "butuhPerhatian"
  ).textContent =
    ringkasan.butuhPerhatian || 0;

}


/* =====================================================
   TAMPILKAN TABEL
===================================================== */

function tampilkanTabel(
  data
) {


  const tbody =
    document.getElementById(
      "isiTabel"
    );


  tbody.innerHTML =
    "";


  if (
    !data ||
    data.length === 0
  ) {

    tbody.innerHTML = `

      <tr>

        <td
          colspan="11"
          style="
            text-align:center;
            padding:25px;
          ">

          Tidak ada data.

        </td>

      </tr>

    `;

    return;

  }


  data.forEach(
    function(item, index) {


      const tr =
        document.createElement(
          "tr"
        );


      const terlambat =
        Number(
          item.terlambat || 0
        );


      /*
       * Tentukan status berdasarkan
       * jumlah terlambat.
       */

      let statusLabel =
        "Baik";


      let statusClass =
        "badge-hijau";


      let rowClass =
        "baris-hijau";


      /*
       * 3 kali atau lebih
       * = BUTUH PERHATIAN
       */

      if (
        terlambat >= 3
      ) {

        statusLabel =
          "⚠️ BUTUH PERHATIAN";


        statusClass =
          "badge-perhatian";


        rowClass =
          "baris-perhatian";

      }


      /*
       * 1-2 kali
       * = TERLAMBAT
       */

      else if (
        terlambat > 0
      ) {

        statusLabel =
          "🔴 TERLAMBAT";


        statusClass =
          "badge-merah";


        rowClass =
          "baris-merah";

      }


      tr.className =
        rowClass;


      const hadir =
        Number(
          item.hadir || 0
        );


      const izin =
        Number(
          item.izin || 0
        );


      const sakit =
        Number(
          item.sakit || 0
        );


      const alpa =
        Number(
          item.alpa || 0
        );


      const total =
        hadir +
        terlambat +
        izin +
        sakit +
        alpa;


      /*
       * Persentase:
       *
       * Hadir + Terlambat
       * dibanding seluruh catatan.
       */

      let persentase = 0;


      if (
        total > 0
      ) {

        persentase =
          Math.round(
            (
              (
                hadir +
                terlambat
              )
              /
              total
            )
            * 100
          );

      }


      tr.innerHTML = `

        <td>
          ${index + 1}
        </td>


        <td>
          ${escapeHTML(
            item.nama || "-"
          )}
        </td>


        <td>
          ${escapeHTML(
            String(
              item.nisn || "-"
            )
          )}
        </td>


        <td>
          ${escapeHTML(
            item.kelas || "-"
          )}
        </td>


        <td>
          ${hadir}
        </td>


        <td>
          ${terlambat}
        </td>


        <td>
          ${izin}
        </td>


        <td>
          ${sakit}
        </td>


        <td>
          ${alpa}
        </td>


        <td>
          ${persentase}%
        </td>


        <td>

          <span
            class="badge ${statusClass}">

            ${statusLabel}

          </span>

        </td>

      `;


      tbody.appendChild(
        tr
      );

    }
  );

}


/* =====================================================
   KEAMANAN HTML
===================================================== */

function escapeHTML(
  text
) {

  return String(text)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}

</script>


</body>

</html>
