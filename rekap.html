<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rekap Absensi - SMK Negeri 1 Palopo</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  color: #1e293b;
}

.container {
  max-width: 1400px;
  margin: auto;
  padding: 20px;
}

/* ================================
   HEADER
================================ */

.header {
  background: white;
  border-radius: 18px;
  padding: 22px;
  margin-bottom: 18px;
  box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

.header h1 {
  margin: 0;
  text-align: center;
  font-size: 25px;
}

.header p {
  text-align: center;
  color: #64748b;
  margin: 8px 0 0;
}

/* ================================
   CARD
================================ */

.card {
  background: white;
  border-radius: 16px;
  padding: 18px;
  margin-bottom: 18px;
  box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

/* ================================
   FILTER
================================ */

.filter {
  display: grid;
  grid-template-columns:
    1fr
    1fr
    1fr
    180px
    120px;

  gap: 12px;
  align-items: end;
}

label {
  display: block;
  font-weight: bold;
  margin-bottom: 6px;
}

select,
input,
button {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  font-size: 15px;
}

select,
input {
  border: 1px solid #cbd5e1;
  background: white;
}

button {
  border: none;
  background: #2563eb;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  opacity: .9;
}

button.reset {
  background: #64748b;
}

.info {
  margin-top: 12px;
  color: #64748b;
  font-size: 14px;
}

/* ================================
   RINGKASAN
================================ */

.ringkasan {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 12px;
}

.box {
  padding: 18px;
  border-radius: 14px;
  text-align: center;
  background: #f8fafc;
}

.box .angka {
  font-size: 28px;
  font-weight: bold;
  margin-top: 6px;
}

.box .judul {
  font-size: 13px;
  color: #64748b;
}

/* ================================
   TABEL
================================ */

.tabel-container {
  overflow-x: auto;
  max-height: 650px;
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 1000px;
}

th,
td {
  padding: 10px;
  border-bottom: 1px solid #e2e8f0;
  text-align: left;
  font-size: 14px;
}

th {
  background: #f8fafc;
  position: sticky;
  top: 0;
  z-index: 2;
}

/* ================================
   WARNA PERHATIAN
================================ */

.merah {
  background: #fee2e2 !important;
  color: #991b1b;
  font-weight: bold;
}

.kuning {
  background: #fef3c7 !important;
  color: #92400e;
  font-weight: bold;
}

.hijau {
  color: #166534;
}

/* ================================
   BADGE
================================ */

.badge {
  display: inline-block;
  padding: 5px 9px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: bold;
}

.badge-merah {
  background: #fecaca;
  color: #991b1b;
}

.badge-kuning {
  background: #fde68a;
  color: #92400e;
}

.badge-hijau {
  background: #dcfce7;
  color: #166534;
}

/* ================================
   LOADING
================================ */

.loading {
  text-align: center;
  padding: 20px;
  color: #64748b;
}

/* ================================
   ERROR
================================ */

.error {
  background: #fee2e2;
  color: #991b1b;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 15px;
  display: none;
}

/* ================================
   RESPONSIVE
================================ */

@media (max-width: 1000px) {

  .filter {
    grid-template-columns: 1fr 1fr;
  }

  .ringkasan {
    grid-template-columns: repeat(3, 1fr);
  }

}

@media (max-width: 600px) {

  .filter {
    grid-template-columns: 1fr;
  }

  .ringkasan {
    grid-template-columns: 1fr 1fr;
  }

}

@media (max-width: 400px) {

  .ringkasan {
    grid-template-columns: 1fr;
  }

}

</style>

</head>

<body>

<div class="container">

<!-- =========================================
     HEADER
========================================= -->

<div class="header">

  <h1>
    📊 REKAP ABSENSI MURID
  </h1>

  <p>
    SMK Negeri 1 Palopo
  </p>

</div>


<!-- =========================================
     ERROR
========================================= -->

<div
  id="errorBox"
  class="error">
</div>


<!-- =========================================
     FILTER
========================================= -->

<div class="card">

  <div class="filter">

    <div>

      <label for="tanggalAwal">
        Tanggal Awal
      </label>

      <input
        type="date"
        id="tanggalAwal">

    </div>


    <div>

      <label for="tanggalAkhir">
        Tanggal Akhir
      </label>

      <input
        type="date"
        id="tanggalAkhir">

    </div>


    <div>

      <label for="filterKelas">
        Kelas
      </label>

      <select id="filterKelas">

        <option value="">
          Semua Kelas
        </option>

      </select>

    </div>


    <div>

      <button
        onclick="muatRekap()">

        🔄 Tampilkan

      </button>

    </div>


    <div>

      <button
        class="reset"
        onclick="resetFilter()">

        Reset

      </button>

    </div>

  </div>


  <div
    id="infoFilter"
    class="info">

    Menampilkan seluruh data.

  </div>

</div>


<!-- =========================================
     RINGKASAN
========================================= -->

<div class="card">

  <div class="ringkasan">


    <div class="box">

      <div class="judul">
        Total Murid
      </div>

      <div
        class="angka"
        id="totalMurid">

        0

      </div>

    </div>


    <div class="box">

      <div class="judul">
        Hadir
      </div>

      <div
        class="angka"
        id="totalHadir">

        0

      </div>

    </div>


    <div class="box">

      <div class="judul">
        Terlambat
      </div>

      <div
        class="angka"
        id="totalTerlambat">

        0

      </div>

    </div>


    <div class="box">

      <div class="judul">
        Murid Terlambat
      </div>

      <div
        class="angka"
        id="muridTerlambat">

        0

      </div>

    </div>


    <div class="box">

      <div class="judul">
        Butuh Perhatian
      </div>

      <div
        class="angka"
        id="butuhPerhatian">

        0

      </div>

    </div>


  </div>

</div>


<!-- =========================================
     TABEL
========================================= -->

<div class="card">

  <h2>
    Daftar Rekap Murid
  </h2>


  <div
    id="loading"
    class="loading">

    Memuat data rekap...

  </div>


  <div class="tabel-container">

    <table id="tabelRekap">

      <thead>

        <tr>

          <th>No</th>

          <th>Nama Murid</th>

          <th>NISN</th>

          <th>Kelas</th>

          <th>Hadir</th>

          <th>Terlambat</th>

          <th>Izin</th>

          <th>Sakit</th>

          <th>Alpa</th>

          <th>Persentase</th>

          <th>Perhatian</th>

        </tr>

      </thead>


      <tbody
        id="isiTabel">

      </tbody>

    </table>

  </div>

</div>

</div>


<script>

/******************************************************
 * URL APPS SCRIPT
 ******************************************************/

const API_URL =
"https://script.google.com/macros/s/AKfycbzV1PeyqDcgfj7SysWZUN_MKGFFWkmtoi9rB_Bw8PsRXrKHnJRZRYzjMpMcTXHDEljb/exec";


/******************************************************
 * DATA REKAP
 ******************************************************/

let semuaData = [];


/******************************************************
 * SAAT HALAMAN DIBUKA
 ******************************************************/

window.addEventListener(
  "load",
  function() {

    muatRekap();

  }
);


/******************************************************
 * MUAT REKAP
 ******************************************************/

async function muatRekap() {

  const loading =
    document.getElementById(
      "loading"
    );

  const errorBox =
    document.getElementById(
      "errorBox"
    );

  errorBox.style.display =
    "none";

  loading.style.display =
    "block";


  const tanggalAwal =
    document.getElementById(
      "tanggalAwal"
    ).value;


  const tanggalAkhir =
    document.getElementById(
      "tanggalAkhir"
    ).value;


  try {

    let url =
      API_URL +
      "?action=rekap_admin";


    if (tanggalAwal) {

      url +=
        "&tanggalAwal=" +
        encodeURIComponent(
          tanggalAwal
        );

    }


    if (tanggalAkhir) {

      url +=
        "&tanggalAkhir=" +
        encodeURIComponent(
          tanggalAkhir
        );

    }


    const response =
      await fetch(
        url,
        {
          method: "GET",
          cache: "no-store"
        }
      );


    const text =
      await response.text();


    console.log(
      "RESPON REKAP:",
      text
    );


    const data =
      JSON.parse(text);


    if (
      data.status !==
      "success"
    ) {

      throw new Error(
        data.message ||
        "Gagal mengambil data rekap."
      );

    }


    semuaData =
      data.data || [];


    /* =========================================
       BUAT DAFTAR KELAS
    ========================================= */

    buatDaftarKelas(
      semuaData
    );


    /* =========================================
       TAMPILKAN REKAP
    ========================================= */

    tampilkanRekapDenganFilter();


  }

  catch(error) {

    console.error(
      "REKAP ERROR:",
      error
    );


    errorBox.textContent =
      "❌ Gagal memuat rekap: " +
      error.message;


    errorBox.style.display =
      "block";

  }

  finally {

    loading.style.display =
      "none";

  }

}


/******************************************************
 * BUAT DAFTAR KELAS
 ******************************************************/

function buatDaftarKelas(
  data
) {

  const select =
    document.getElementById(
      "filterKelas"
    );


  const kelasSet =
    new Set();


  data.forEach(
    function(item) {

      if (
        item.kelas
      ) {

        kelasSet.add(
          String(
            item.kelas
          ).trim()
        );

      }

    }
  );


  const kelasArray =
    Array.from(
      kelasSet
    ).sort(
      function(a,b) {

        return a.localeCompare(
          b,
          "id",
          {
            numeric: true
          }
        );

      }
    );


  select.innerHTML =
    `
    <option value="">
      Semua Kelas
    </option>
    `;


  kelasArray.forEach(
    function(kelas) {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        kelas;


      option.textContent =
        kelas;


      select.appendChild(
        option
      );

    }
  );

}


/******************************************************
 * TAMPILKAN REKAP DENGAN FILTER
 ******************************************************/

function tampilkanRekapDenganFilter() {

  const kelas =
    document.getElementById(
      "filterKelas"
    ).value;


  let data =
    semuaData.slice();


  if (kelas) {

    data =
      data.filter(
        function(item) {

          return String(
            item.kelas || ""
          ).trim() === kelas;

        }
      );

  }


  tampilkanRingkasan(
    data
  );


  tampilkanTabel(
    data
  );


  const tanggalAwal =
    document.getElementById(
      "tanggalAwal"
    ).value;


  const tanggalAkhir =
    document.getElementById(
      "tanggalAkhir"
    ).value;


  let info =
    "";


  if (
    kelas
  ) {

    info +=
      "Kelas: " +
      kelas +
      " | ";

  }


  if (
    tanggalAwal ||
    tanggalAkhir
  ) {

    info +=
      "Berdasarkan periode yang dipilih.";

  }

  else {

    info +=
      "Menampilkan seluruh data.";

  }


  document.getElementById(
    "infoFilter"
  ).textContent =
    info;

}


/******************************************************
 * RINGKASAN
 *
 * PERBAIKAN UTAMA:
 *
 * Murid terlambat dihitung dari
 * jumlah murid yang terlambat > 0.
 ******************************************************/

function tampilkanRingkasan(
  data
) {

  let totalHadir = 0;

  let totalTerlambat = 0;

  let jumlahMuridTerlambat = 0;

  let jumlahButuhPerhatian = 0;


  data.forEach(
    function(item) {

      const hadir =
        Number(
          item.hadir || 0
        );


      const terlambat =
        Number(
          item.terlambat || 0
        );


      totalHadir +=
        hadir;


      totalTerlambat +=
        terlambat;


      /* =========================================
         JIKA MURID TERLAMBAT MINIMAL 1 KALI
         ========================================= */

      if (
        terlambat > 0
      ) {

        jumlahMuridTerlambat++;

      }


      /* =========================================
         BUTUH PERHATIAN
         ========================================= */

      if (
        terlambat >= 3
        ||
        Number(
          item.alpa || 0
        ) >= 3
      ) {

        jumlahButuhPerhatian++;

      }

    }
  );


  document.getElementById(
    "totalMurid"
  ).textContent =
    data.length;


  document.getElementById(
    "totalHadir"
  ).textContent =
    totalHadir;


  document.getElementById(
    "totalTerlambat"
  ).textContent =
    totalTerlambat;


  document.getElementById(
    "muridTerlambat"
  ).textContent =
    jumlahMuridTerlambat;


  document.getElementById(
    "butuhPerhatian"
  ).textContent =
    jumlahButuhPerhatian;

}


/******************************************************
 * TABEL
 ******************************************************/

function tampilkanTabel(
  data
) {

  const tbody =
    document.getElementById(
      "isiTabel"
    );


  tbody.innerHTML =
    "";


  if (
    !data ||
    data.length === 0
  ) {

    tbody.innerHTML =
      `
      <tr>

        <td
          colspan="11"
          style="
            text-align:center;
            padding:30px;
          ">

          Tidak ada data.

        </td>

      </tr>
      `;

    return;

  }


  data.forEach(
    function(item,index) {

      const tr =
        document.createElement(
          "tr"
        );


      const hadir =
        Number(
          item.hadir || 0
        );


      const terlambat =
        Number(
          item.terlambat || 0
        );


      const izin =
        Number(
          item.izin || 0
        );


      const sakit =
        Number(
          item.sakit || 0
        );


      const alpa =
        Number(
          item.alpa || 0
        );


      /* =========================================
         TENTUKAN PERHATIAN
      ========================================= */

      let kode =
        "HIJAU";


      let label =
        "Baik";


      /*
       * PRIORITAS:
       *
       * Terlambat >= 3
       * atau Alpa >= 3
       * = MERAH / BUTUH PERHATIAN
       *
       * Terlambat 1-2
       * = MERAH
       */


      if (
        terlambat >= 3
        ||
        alpa >= 3
      ) {

        kode =
          "MERAH";


        label =
          "BUTUH PERHATIAN";

      }

      else if (
        terlambat > 0
      ) {

        kode =
          "MERAH";


        label =
          "TERLAMBAT";

      }

      else {

        kode =
          "HIJAU";


        label =
          "Baik";

      }


      /* =========================================
         WARNA BARIS
      ========================================= */

      if (
        kode === "MERAH"
      ) {

        tr.className =
          "merah";

      }

      else {

        tr.className =
          "hijau";

      }


      /* =========================================
         BADGE
      ========================================= */

      let badgeClass =
        "badge-hijau";


      if (
        kode === "MERAH"
      ) {

        badgeClass =
          "badge-merah";

      }


      tr.innerHTML =
        `

        <td>
          ${index + 1}
        </td>


        <td>
          ${escapeHTML(
            item.nama || "-"
          )}
        </td>


        <td>
          ${escapeHTML(
            String(
              item.nisn || "-"
            )
          )}
        </td>


        <td>
          ${escapeHTML(
            item.kelas || "-"
          )}
        </td>


        <td>
          ${hadir}
        </td>


        <td>
          ${terlambat}
        </td>


        <td>
          ${izin}
        </td>


        <td>
          ${sakit}
        </td>


        <td>
          ${alpa}
        </td>


        <td>
          ${Number(
            item.persentase || 0
          )}%
        </td>


        <td>

          <span
            class="badge ${badgeClass}">

            ${escapeHTML(
              label
            )}

          </span>

        </td>

        `;


      tbody.appendChild(
        tr
      );

    }
  );

}


/******************************************************
 * RESET FILTER
 ******************************************************/

function resetFilter() {

  document.getElementById(
    "tanggalAwal"
  ).value =
    "";


  document.getElementById(
    "tanggalAkhir"
  ).value =
    "";


  document.getElementById(
    "filterKelas"
  ).value =
    "";


  tampilkanRekapDenganFilter();

}


/******************************************************
 * KEAMANAN HTML
 ******************************************************/

function escapeHTML(
  text
) {

  return String(
    text
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}

</script>

</body>
</html>
