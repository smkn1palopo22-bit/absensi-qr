<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<title>
  Rekap Absensi - SMK Negeri 1 Palopo
</title>


<style>

* {
  box-sizing: border-box;
}


body {

  margin: 0;

  font-family:
    Arial,
    sans-serif;

  background:
    #f1f5f9;

  color:
    #1e293b;

}


.container {

  max-width:
    1250px;

  margin:
    auto;

  padding:
    20px;

}


.header {

  background:
    white;

  border-radius:
    18px;

  padding:
    22px;

  margin-bottom:
    18px;

  box-shadow:
    0 3px 12px
    rgba(0,0,0,.08);

}


.header h1 {

  margin:
    0;

  text-align:
    center;

  font-size:
    25px;

}


.header p {

  text-align:
    center;

  color:
    #64748b;

  margin:
    8px 0 0;

}


.card {

  background:
    white;

  border-radius:
    16px;

  padding:
    18px;

  margin-bottom:
    18px;

  box-shadow:
    0 3px 12px
    rgba(0,0,0,.08);

}


.filter {

  display:
    grid;

  grid-template-columns:
    1fr 1fr 1fr 1fr;

  gap:
    12px;

}


label {

  display:
    block;

  font-weight:
    bold;

  margin-bottom:
    6px;

}


select,
input,
button {

  width:
    100%;

  padding:
    12px;

  border-radius:
    10px;

  font-size:
    15px;

}


select,
input {

  border:
    1px solid #cbd5e1;

  background:
    white;

}


button {

  border:
    none;

  background:
    #2563eb;

  color:
    white;

  font-weight:
    bold;

  cursor:
    pointer;

  margin-top:
    24px;

}


button:hover {

  opacity:
    .9;

}


.info {

  margin-top:
    12px;

  color:
    #64748b;

  font-size:
    14px;

}


.ringkasan {

  display:
    grid;

  grid-template-columns:
    repeat(4, 1fr);

  gap:
    12px;

}


.box {

  padding:
    18px;

  border-radius:
    14px;

  text-align:
    center;

  background:
    #f8fafc;

}


.box .angka {

  font-size:
    28px;

  font-weight:
    bold;

  margin-top:
    6px;

}


.box .judul {

  font-size:
    13px;

  color:
    #64748b;

}


.tabel-container {

  overflow-x:
    auto;

}


table {

  width:
    100%;

  border-collapse:
    collapse;

  min-width:
    950px;

}


th,
td {

  padding:
    10px;

  border-bottom:
    1px solid #e2e8f0;

  text-align:
    left;

  font-size:
    14px;

}


th {

  background:
    #f8fafc;

  position:
    sticky;

  top:
    0;

}


.merah {

  background:
    #fee2e2 !important;

  color:
    #991b1b;

  font-weight:
    bold;

}


.kuning {

  background:
    #fef3c7 !important;

  color:
    #92400e;

  font-weight:
    bold;

}


.hijau {

  color:
    #166534;

  font-weight:
    bold;

}


.badge {

  display:
    inline-block;

  padding:
    5px 9px;

  border-radius:
    8px;

  font-size:
    12px;

  font-weight:
    bold;

}


.badge-merah {

  background:
    #fecaca;

  color:
    #991b1b;

}


.badge-hijau {

  background:
    #dcfce7;

  color:
    #166534;

}


.loading {

  text-align:
    center;

  padding:
    20px;

  color:
    #64748b;

}


.error {

  background:
    #fee2e2;

  color:
    #991b1b;

  padding:
    15px;

  border-radius:
    10px;

  margin-bottom:
    15px;

  display:
    none;

}


.kelas-info {

  font-weight:
    bold;

  color:
    #2563eb;

}


@media (
  max-width: 900px
) {

  .filter {

    grid-template-columns:
      1fr 1fr;

  }

}


@media (
  max-width: 600px
) {

  .filter {

    grid-template-columns:
      1fr;

  }


  button {

    margin-top:
      0;

  }


  .ringkasan {

    grid-template-columns:
      1fr 1fr;

  }

}


@media (
  max-width: 400px
) {

  .ringkasan {

    grid-template-columns:
      1fr;

  }

}

</style>

</head>


<body>


<div class="container">


  <!-- HEADER -->

  <div class="header">

    <h1>
      📊 REKAP ABSENSI MURID
    </h1>

    <p>
      SMK Negeri 1 Palopo
    </p>

  </div>


  <!-- ERROR -->

  <div
    id="errorBox"
    class="error">
  </div>


  <!-- FILTER -->

  <div class="card">


    <div class="filter">


      <!-- TANGGAL AWAL -->

      <div>

        <label
          for="tanggalAwal">

          Tanggal Awal

        </label>


        <input
          type="date"
          id="tanggalAwal">

      </div>


      <!-- TANGGAL AKHIR -->

      <div>

        <label
          for="tanggalAkhir">

          Tanggal Akhir

        </label>


        <input
          type="date"
          id="tanggalAkhir">

      </div>


      <!-- KELAS -->

      <div>

        <label
          for="kelas">

          Pilih Kelas

        </label>


        <select
          id="kelas">

          <option value="">
            Semua Kelas
          </option>

        </select>

      </div>


      <!-- BUTTON -->

      <div>

        <label>
          &nbsp;
        </label>


        <button
          onclick="muatRekap()">

          🔄 Tampilkan Rekap

        </button>

      </div>


    </div>


    <div
      id="infoFilter"
      class="info">

      Menampilkan seluruh data.

    </div>


  </div>


  <!-- RINGKASAN -->

  <div class="card">


    <div class="ringkasan">


      <!-- TOTAL MURID -->

      <div class="box">

        <div class="judul">

          👥 Total Murid

        </div>


        <div
          class="angka"
          id="totalMurid">

          0

        </div>

      </div>


      <!-- HADIR -->

      <div class="box">

        <div class="judul">

          ✅ Hadir

        </div>


        <div
          class="angka"
          id="totalHadir">

          0

        </div>

      </div>


      <!-- TERLAMBAT -->

      <div class="box">

        <div class="judul">

          🔴 Terlambat

        </div>


        <div
          class="angka"
          id="totalTerlambat">

          0

        </div>

      </div>


      <!-- BUTUH PERHATIAN -->

      <div class="box">

        <div class="judul">

          ⚠️ Butuh Perhatian

        </div>


        <div
          class="angka"
          id="butuhPerhatian">

          0

        </div>

      </div>


    </div>


  </div>


  <!-- TABEL -->

  <div class="card">


    <h2>
      Daftar Rekap Murid
    </h2>


    <div
      id="loading"
      class="loading">

      Memuat data rekap...

    </div>


    <div class="tabel-container">


      <table
        id="tabelRekap">


        <thead>

          <tr>

            <th>
              No
            </th>

            <th>
              Nama Murid
            </th>

            <th>
              NISN
            </th>

            <th>
              Kelas
            </th>

            <th>
              Hadir
            </th>

            <th>
              Terlambat
            </th>

            <th>
              Izin
            </th>

            <th>
              Sakit
            </th>

            <th>
              Alpa
            </th>

            <th>
              Persentase
            </th>

            <th>
              Perhatian
            </th>

          </tr>

        </thead>


        <tbody
          id="isiTabel">
        </tbody>


      </table>


    </div>


  </div>


</div>


<script>


/************************************************************
 * URL APPS SCRIPT
 ************************************************************/

const API_URL =
"https://script.google.com/macros/s/AKfycbzV1PeyqDcgfj7SysWZUN_MKGFFWkmtoi9rB_Bw8PsRXrKHnJRZRYzjMpMcTXHDEljb/exec";


/************************************************************
 * SAAT HALAMAN DIBUKA
 ************************************************************/

window.addEventListener(
  "load",
  async function() {

    await muatDaftarKelas();

    await muatRekap();

  }
);


/************************************************************
 * MUAT DAFTAR KELAS
 ************************************************************/

async function muatDaftarKelas() {

  const select =
    document.getElementById(
      "kelas"
    );


  try {

    /*
     * Untuk mendapatkan daftar kelas,
     * kita mengambil seluruh rekap.
     */

    const url =
      API_URL +
      "?action=rekap_admin";


    const response =
      await fetch(
        url,
        {
          method:
            "GET",

          cache:
            "no-store"
        }
      );


    const text =
      await response.text();


    const data =
      JSON.parse(
        text
      );


    if (
      data.status !==
      "success"
    ) {

      return;

    }


    const daftar =
      [];


    (data.data || [])
      .forEach(
        function(item) {

          const kelas =
            String(
              item.kelas || ''
            ).trim();


          if (
            kelas &&
            !daftar.includes(
              kelas
            )
          ) {

            daftar.push(
              kelas
            );

          }

        }
      );


    daftar.sort(
      function(a, b) {

        return a.localeCompare(
          b,
          'id',
          {
            numeric:
              true
          }
        );

      }
    );


    daftar.forEach(
      function(kelas) {

        const option =
          document.createElement(
            "option"
          );


        option.value =
          kelas;


        option.textContent =
          kelas;


        select.appendChild(
          option
        );

      }
    );

  }

  catch(error) {

    console.error(
      "Gagal memuat kelas:",
      error
    );

  }

}


/************************************************************
 * MUAT REKAP
 ************************************************************/

async function muatRekap() {


  const loading =
    document.getElementById(
      "loading"
    );


  const errorBox =
    document.getElementById(
      "errorBox"
    );


  errorBox.style.display =
    "none";


  loading.style.display =
    "block";


  const tanggalAwal =
    document.getElementById(
      "tanggalAwal"
    ).value;


  const tanggalAkhir =
    document.getElementById(
      "tanggalAkhir"
    ).value;


  const kelas =
    document.getElementById(
      "kelas"
    ).value;


  try {


    let url =
      API_URL +
      "?action=rekap_admin";


    if (
      tanggalAwal
    ) {

      url +=
        "&tanggalAwal=" +
        encodeURIComponent(
          tanggalAwal
        );

    }


    if (
      tanggalAkhir
    ) {

      url +=
        "&tanggalAkhir=" +
        encodeURIComponent(
          tanggalAkhir
        );

    }


    if (
      kelas
    ) {

      url +=
        "&kelas=" +
        encodeURIComponent(
          kelas
        );

    }


    const response =
      await fetch(
        url,
        {
          method:
            "GET",

          cache:
            "no-store"
        }
      );


    const text =
      await response.text();


    console.log(
      "RESPON REKAP:",
      text
    );


    const data =
      JSON.parse(
        text
      );


    if (
      data.status !==
      "success"
    ) {

      throw new Error(
        data.message ||
        "Gagal mengambil data rekap."
      );

    }


    tampilkanRingkasan(
      data.ringkasan ||
      {}
    );


    tampilkanTabel(
      data.data ||
      []
    );


    tampilkanInfoFilter(
      tanggalAwal,
      tanggalAkhir,
      kelas
    );


  }

  catch(error) {


    console.error(
      "REKAP ERROR:",
      error
    );


    errorBox.textContent =
      "❌ Gagal memuat rekap: " +
      error.message;


    errorBox.style.display =
      "block";


  }

  finally {


    loading.style.display =
      "none";

  }

}


/************************************************************
 * INFORMASI FILTER
 ************************************************************/

function tampilkanInfoFilter(
  tanggalAwal,
  tanggalAkhir,
  kelas
) {


  const info =
    document.getElementById(
      "infoFilter"
    );


  let teks =
    "";


  if (
    kelas
  ) {

    teks +=
      "Kelas: " +
      kelas;

  }

  else {

    teks +=
      "Semua Kelas";

  }


  if (
    tanggalAwal ||
    tanggalAkhir
  ) {

    teks +=
      " | ";


    if (
      tanggalAwal
    ) {

      teks +=
        "Mulai " +
        formatTanggal(
          tanggalAwal
        );

    }


    if (
      tanggalAkhir
    ) {

      teks +=
        " sampai " +
        formatTanggal(
          tanggalAkhir
        );

    }

  }


  info.textContent =
    teks;

}


/************************************************************
 * FORMAT TANGGAL
 ************************************************************/

function formatTanggal(
  value
) {


  if (!value) {

    return "";

  }


  const parts =
    value.split("-");


  if (
    parts.length !== 3
  ) {

    return value;

  }


  return (
    parts[2] +
    "/" +
    parts[1] +
    "/" +
    parts[0]
  );

}


/************************************************************
 * RINGKASAN
 ************************************************************/

function tampilkanRingkasan(
  ringkasan
) {


  document.getElementById(
    "totalMurid"
  ).textContent =
    ringkasan.totalMurid ||
    0;


  document.getElementById(
    "totalHadir"
  ).textContent =
    ringkasan.hadir ||
    0;


  document.getElementById(
    "totalTerlambat"
  ).textContent =
    ringkasan.terlambat ||
    0;


  document.getElementById(
    "butuhPerhatian"
  ).textContent =
    ringkasan.butuhPerhatian ||
    0;

}


/************************************************************
 * TABEL
 ************************************************************/

function tampilkanTabel(
  data
) {


  const tbody =
    document.getElementById(
      "isiTabel"
    );


  tbody.innerHTML =
    "";


  if (
    !data ||
    data.length === 0
  ) {


    tbody.innerHTML = `

      <tr>

        <td
          colspan="11"
          style="
            text-align:center;
            padding:30px;
          ">

          Tidak ada data
          untuk filter yang dipilih.

        </td>

      </tr>

    `;


    return;

  }


  data.forEach(
    function(item, index) {


      const tr =
        document.createElement(
          "tr"
        );


      const perhatian =
        item.perhatian ||
        {};


      let kelasWarna =
        "hijau";


      if (
        perhatian.kode ===
        "MERAH"
      ) {

        kelasWarna =
          "merah";

      }


      else if (
        perhatian.kode ===
        "TERLAMBAT"
      ) {

        kelasWarna =
          "merah";

      }


      tr.className =
        kelasWarna;


      let badgeHTML =
        "";


      if (
        item.terlambat >= 3
      ) {

        badgeHTML = `

          <span
            class="badge badge-merah">

            ⚠️ BUTUH PERHATIAN

          </span>

        `;

      }


      else if (
        item.terlambat > 0
      ) {

        badgeHTML = `

          <span
            class="badge badge-merah">

            🔴 TERLAMBAT

          </span>

        `;

      }


      else {

        badgeHTML = `

          <span
            class="badge badge-hijau">

            🟢 Baik

          </span>

        `;

      }


      tr.innerHTML = `

        <td>
          ${index + 1}
        </td>


        <td>
          ${escapeHTML(
            item.nama || "-"
          )}
        </td>


        <td>
          ${escapeHTML(
            String(
              item.nisn || "-"
            )
          )}
        </td>


        <td>
          ${escapeHTML(
            item.kelas || "-"
          )}
        </td>


        <td>
          ${item.hadir || 0}
        </td>


        <td>
          ${item.terlambat || 0}
        </td>


        <td>
          ${item.izin || 0}
        </td>


        <td>
          ${item.sakit || 0}
        </td>


        <td>
          ${item.alpa || 0}
        </td>


        <td>
          ${item.persentase || 0}%
        </td>


        <td>
          ${badgeHTML}
        </td>

      `;


      tbody.appendChild(
        tr
      );

    }
  );

}


/************************************************************
 * ESCAPE HTML
 ************************************************************/

function escapeHTML(
  text
) {


  return String(
    text
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}

</script>


</body>

</html>
